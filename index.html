function printOne(){var s=collectForm()||students.find(function(x){return x.id===currentId;});if(!s||!s.name){showToast('학생 정보를 입력하고 저장해 주세요.');return;}openPrint([s]);}
function openPrint(list){if(!list||!list.length){showToast('인쇄할 학생을 선택해 주세요.');return;}document.getElementById('print-title').textContent=list.length===1?list[0].name+' 성적표 미리보기':'성적표 '+list.length+'명 일괄 인쇄';document.getElementById('print-cards').innerHTML=list.map(function(s,i){return buildReportHtml(s,generateAnalysis(s))+(i<list.length-1?'<div class="pg-break"></div>':'');}).join('');document.getElementById('print-overlay').classList.add('open');}
function closePrint(){document.getElementById('print-overlay').classList.remove('open');}


function buildReportHtml(s,analysis){
  var cfg=LEVEL_CFG[s.testLevel];
  var total=null;if(cfg){var sum=0,has=false;cfg.areas.forEach(function(a){var v=s.scores&&s.scores[a.key];if(v!=null){sum+=v;has=true;}});if(has)total=sum;}
  var ds=s.testDate?s.testDate.replace(/-/g,'.'):'—',pt=s.pretest||{};

  var preHtml='';
  if(s.showPretest){
    var histText=s.learningHistory!=null&&HISTORY_ITEMS[s.learningHistory]?HISTORY_ITEMS[s.learningHistory]:null;
    var ptHasData=[1,2,3].some(function(step){return pt[step]&&(pt[step].level||pt[step].score!=null);});
    if(histText||ptHasData){
      var ptR=[1,2,3].map(function(step){var d=pt[step]||{};if(!d.level&&(d.score==null||d.score===undefined))return'<tr><td colspan="4" style="text-align:center;color:#aaa;padding:5px;font-size:9px">'+step+'단계 미응시</td></tr>';var bw=d.score!=null?d.score*10:0;return'<tr style="border-bottom:0.5px solid #e0f0e0"><td style="padding:5px 7px;text-align:center;font-weight:700;color:#1a3a5c">'+step+'단계</td><td style="padding:5px 7px;text-align:center"><span style="background:#e0f5e8;color:#1a5a2a;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700">'+(d.level||'—')+'</span></td><td style="padding:5px 7px;text-align:center;font-weight:700;color:#2c5282">'+(d.score!=null?d.score+' / 10':'—')+'</td><td style="padding:5px 7px"><div style="display:flex;align-items:center;gap:4px"><div style="flex:1;background:#edf2f8;border-radius:20px;height:9px;overflow:hidden"><div style="width:'+bw+'%;height:100%;background:#2d7a4f;border-radius:20px"></div></div><span style="font-size:9px;font-weight:700;color:#2d7a4f;min-width:26px;text-align:right">'+bw+'%</span></div></td></tr>';}).join('');
      preHtml='<div class="rc-sec"><div class="rc-st" style="border-left-color:#2d7a4f">Online Pre-Test</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start">'+(histText?'<div style="background:#f0fbf2;border:1px solid #b0d8b0;border-radius:6px;padding:9px 12px"><div style="font-size:9px;font-weight:700;color:#2d7a4f;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">현재 영어 학습 능력</div><div style="font-size:11px;color:#1a4a2a;line-height:1.6">'+histText+'</div></div>':'<div></div>')+'<table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr><th style="background:#2d7a4f;color:#c8f0da;padding:5px 7px;text-align:center">단계</th><th style="background:#2d7a4f;color:#c8f0da;padding:5px 7px;text-align:center">레벨</th><th style="background:#2d7a4f;color:#c8f0da;padding:5px 7px;text-align:center">맞은 문항</th><th style="background:#2d7a4f;color:#c8f0da;padding:5px 7px;text-align:center">성취율</th></tr></thead><tbody>'+ptR+'</tbody></table></div></div><div class="rc-div"></div>';
    }
  }

  var aHtml='';
  if(cfg){
    cfg.areas.forEach(function(a){var myS=s.scores&&s.scores[a.key]!=null?s.scores[a.key]:null;var myP=myS!=null?Math.round(myS/a.max*1000)/10:null;var avS=s.avgs&&s.avgs[a.key]!=null?s.avgs[a.key]:null;var avP=avS!=null?Math.round(avS/a.max*1000)/10:null;aHtml+='<tr><td style="width:170px;padding:5px 8px 5px 0;font-size:10px;color:#3a5a7a;vertical-align:middle"><strong style="display:block;font-size:11px;color:#1a3a5c;font-weight:700">'+a.name+'</strong><span style="font-size:9px;color:#8aa8c0">배점 '+a.max+'점</span></td><td style="padding:4px 6px;vertical-align:middle"><div style="display:flex;align-items:center;gap:5px;margin-bottom:'+(s.showAvg&&avS!=null?2:0)+'px"><span style="font-size:9px;color:#6b8aa8;width:58px;flex-shrink:0">My Score</span><div style="flex:1;background:#edf2f8;border-radius:20px;height:11px;overflow:hidden"><div style="width:'+(myP||0)+'%;height:100%;background:#2d6fb0;border-radius:20px"></div></div><span style="font-size:10px;font-weight:700;color:#2c5282;width:48px;text-align:right">'+(myS!=null?myS+'/'+a.max:'—')+'</span></div>'+(s.showAvg&&avS!=null?'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:9px;color:#6b8aa8;width:58px;flex-shrink:0">Average</span><div style="flex:1;background:#edf2f8;border-radius:20px;height:11px;overflow:hidden"><div style="width:'+avP+'%;height:100%;background:#b0c8e0;border-radius:20px"></div></div><span style="font-size:10px;color:#8aa8c0;width:48px;text-align:right">'+Math.round(avS*10)/10+'점</span></div>':'')+'</td></tr>';});
    if(total!=null){var tp=Math.round(total/cfg.total*1000)/10;var atT=s.showAvg?cfg.areas.reduce(function(s2,a){var v=s.avgs&&s.avgs[a.key];return v!=null?s2+v:s2;},0):null;var atp=atT!=null?Math.round(atT/cfg.total*1000)/10:null;aHtml+='<tr style="background:#f0f6fc"><td style="padding:5px 8px 5px 0;font-size:10px;vertical-align:middle"><strong style="font-size:12px;color:#1a3a5c;font-weight:700">Total Score</strong><br><span style="font-size:9px;color:#8aa8c0">만점 '+cfg.total+'점</span></td><td style="padding:4px 6px;vertical-align:middle"><div style="display:flex;align-items:center;gap:5px;margin-bottom:'+(s.showAvg&&atT!=null?2:0)+'px"><span style="font-size:9px;font-weight:700;color:#1a3a5c;width:58px;flex-shrink:0">My Score</span><div style="flex:1;background:#edf2f8;border-radius:20px;height:11px;overflow:hidden"><div style="width:'+tp+'%;height:100%;background:#2d6fb0;border-radius:20px"></div></div><span style="font-size:12px;font-weight:700;color:#2c5282;width:48px;text-align:right">'+total+'/'+cfg.total+'</span></div>'+(s.showAvg&&atT!=null?'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:9px;font-weight:700;color:#6b8aa8;width:58px;flex-shrink:0">Average</span><div style="flex:1;background:#edf2f8;border-radius:20px;height:11px;overflow:hidden"><div style="width:'+atp+'%;height:100%;background:#b0c8e0;border-radius:20px"></div></div><span style="font-size:10px;color:#8aa8c0;width:48px;text-align:right">'+Math.round(atT*10)/10+'점</span></div>':'')+'</td></tr>';}
  }

  // 분석 카드 (입력 점수 기반 + 세부 능력 태그)
  var analysisHtml='';
  if(analysis&&analysis.areas){
    var cards=analysis.areas.map(function(a){
      var scoreTxt=a.correctPts!=null?a.correctPts+'/'+a.max:'—/'+a.max;
      var barW=a.pct!=null?a.pct:0;
      var pctTxt=a.pct!=null?a.pct+'%':'—';
      var skillTagsHtml='';
      if(a.skillList&&a.skillList.length){
        skillTagsHtml='<div class="ac-skills">취약 능력: '+a.skillList.slice(0,3).map(function(g){return'<span style="display:inline-block;background:#e8f0fc;color:#2c5282;padding:0 4px;border-radius:3px;margin:1px;font-size:8px">'+g.skill+'('+g.qs.map(function(q){return q+'번';}).join('·')+')</span>';}).join('')+'</div>';
      }
      return'<div class="ac"><div class="ac-hd" style="background:'+a.color+'"><span class="ac-title">'+a.name+'</span><span class="ac-sb">총점 '+scoreTxt+'</span></div>'
        +'<div class="ac-bd"><div class="ac-row"><span class="ac-lbl">정답률</span><div class="ac-bar"><div class="ac-fill" style="width:'+barW+'%;background:'+a.color+'"></div></div><span class="ac-pct" style="color:'+a.color+'">'+pctTxt+'</span></div>'
        +(a.wrongQs&&a.wrongQs.length?'<div class="wrong-tags">오답: '+a.wrongQs.map(function(q){return'<span class="wrong-tag">'+q+'번</span>';}).join('')+'</div>':'')
        +skillTagsHtml
        +(a.comment?'<div class="ac-comment">'+a.comment+'</div>':'')
        +'</div></div>';
    }).join('');
    analysisHtml='<div class="ac-grid">'+cards+'</div><div class="overall-box"><span class="overall-icon">💡</span><div class="overall-text"><strong>종합 학습 의견</strong>'+analysis.overall+'</div></div>';

  return'<div class="rc"><div class="rc-hd"><div class="rc-logo"><span>C</span>HESS</div><div class="rc-hsub"><div class="t">Report Card</div><div class="s">정상어학원 입학시험 성적표</div></div><div class="rc-badge">PLACEMENT TEST</div></div>'

function excelDateToStr(v){
  if(!v)return'';
  // 숫자형 → 엑셀 시리얼 날짜 변환 (예: 46163 → 2026-05-26)
  if(typeof v==='number'){
    var d=new Date(Math.round((v-25569)*86400*1000));
    var y=d.getUTCFullYear();
    var mo=String(d.getUTCMonth()+1).padStart(2,'0');
    var day=String(d.getUTCDate()).padStart(2,'0');
    return y+'-'+mo+'-'+day;
  }
  if(typeof v==='string'){
    // 이미 날짜 문자열인 경우
    var m=v.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
    if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    // 숫자 문자열인 경우
    var n=parseFloat(v);
    if(!isNaN(n)&&n>40000){
      var d2=new Date(Math.round((n-25569)*86400*1000));
      return d2.getUTCFullYear()+'-'+String(d2.getUTCMonth()+1).padStart(2,'0')+'-'+String(d2.getUTCDate()).padStart(2,'0');
    }
  }
  return String(v);
}

// CSV 파싱 (엑셀에서 CSV로 저장한 파일 처리)
function parseCSV(text){
  var rows=[];
  var lines=text.split(/\r?\n/);
  lines.forEach(function(line){
    if(!line.trim())return;
    var cells=[];
    var cur='';
    var inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(c==='"'&&!inQ){inQ=true;}
      else if(c==='"'&&inQ){
        if(line[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      }else if(c===','&&!inQ){cells.push(cur.trim());cur='';}
      else cur+=c;
    }
    cells.push(cur.trim());
    rows.push(cells);
  });
  return rows;
}

function handleFile(file){
  if(!file)return;
  var ok=document.getElementById('upload-ok');
  var er=document.getElementById('upload-err');
  ok.style.display='none'; er.style.display='none';

  var name=file.name.toLowerCase();
  var isXlsx=name.endsWith('.xlsx')||name.endsWith('.xls');
  var isCsv=name.endsWith('.csv');

  if(!isXlsx&&!isCsv){
    er.textContent='.xlsx 또는 .csv 파일만 업로드할 수 있어요.';
    er.style.display=''; return;
  }

  var reader=new FileReader();

  if(isCsv){
    // CSV: 직접 파싱 (라이브러리 불필요)
    reader.onload=function(e){
      try{
        var rows=parseCSV(e.target.result);
        var dataRows=rows.slice(4).filter(function(r){return r[1]&&String(r[1]).trim();});
        processRows(dataRows,ok,er);
      }catch(e2){er.textContent='파일 읽기 오류: '+e2.message; er.style.display='';}
    };
    reader.readAsText(file,'UTF-8');

  } else {
    // xlsx: SheetJS(XLSX)가 로드됐으면 사용, 없으면 사용자에게 CSV 안내
    reader.onload=function(e){
      try{
        if(typeof XLSX!=='undefined'){
          var wb=XLSX.read(e.target.result,{type:'array'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          var dataRows=rows.slice(4).filter(function(r){return r[1]&&String(r[1]).trim();});
          processRows(dataRows,ok,er);
        } else {
          // SheetJS 없음 → CSV 안내
          er.innerHTML='<strong>xlsx 파일은 현재 환경에서 차단될 수 있어요.</strong><br>'
            +'엑셀에서 <b>파일 → 다른 이름으로 저장 → CSV UTF-8 (쉼표로 분리)</b>로 저장 후 업로드해 주세요.<br>'
            +'<small>CSV 파일도 엑셀로 열고 편집할 수 있어요.</small>';
          er.style.display='';
        }
      }catch(e2){er.textContent='파일 읽기 오류: '+e2.message; er.style.display='';}
    };
    reader.readAsArrayBuffer(file);
  }
}
function processRows(dataRows,ok,er){
  var added=0,skipped=0,warns=[],newStudents=[];
  dataRows.forEach(function(r){
    var name=String(r[1]||'').trim();
    if(!name){skipped++;return;}
    var lv=String(r[6]||'').trim();
    var cfg=LEVEL_CFG[lv];
    var startSem=parseStart(String(r[5]||'').trim());
    var scores={},avgs={};
    [[7,'a1'],[8,'a2'],[9,'a3'],[10,'a4']].forEach(function(p){
      var v=r[p[0]];if(v!==''&&v!=null&&!isNaN(v))scores[p[1]]=parseFloat(v);
    });
    [[11,'a1'],[12,'a2'],[13,'a3'],[14,'a4']].forEach(function(p){
      var v=r[p[0]];if(v!==''&&v!=null&&!isNaN(v))avgs[p[1]]=parseFloat(v);
    });
    if(cfg)cfg.areas.forEach(function(a){
      var v=scores[a.key];if(v!=null&&v>a.max)warns.push(name+' 영역'+a.n+' 초과');
    });
    // 오답: V열(21번)~AR열(53번)
    var wrongSet=[];
    for(var wi=21;wi<=53;wi++){
      var wval=r[wi];
      if(wval!==''&&wval!=null){
        var wnum=parseInt(wval);
        if(!isNaN(wnum)&&wnum>=1&&wnum<=33)wrongSet.push(wnum);
      }
    }
    var s={
      id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      memberCode:String(r[0]||'').trim(),name:name,
      school:String(r[2]||'').trim(),grade:String(r[3]||'').trim(),
      testDate:excelDateToStr(r[4]),startSem:startSem,testLevel:lv,
      chessLevel:String(r[15]||'').trim(),className:String(r[16]||'').trim(),
      classTime:String(r[17]||'').trim(),teacher:String(r[18]||'').trim(),
      room:String(r[19]||'').trim(),notice:String(r[20]||'').trim(),
      showAvg:Object.keys(avgs).length>0,showPretest:false,
      scores:scores,avgs:avgs,wrongSet:wrongSet,
      pretest:{},learningHistory:null,updatedAt:Date.now()
    };
    students.unshift(s);newStudents.push(s);added++;
  });
  persistAll(newStudents);
  renderSidebar();
  var msg='✓ '+added+'명 업로드 완료'+(skipped?' ('+skipped+'명 건너뜀)':'');
  if(warns.length)msg+='\n\n⚠ 점수 초과:\n'+warns.join('\n');
  ok.textContent=msg;ok.style.display='';
  showToast(added+'명 업로드 완료!');
}

// ── 버튼 이벤트 연결 (inline onclick 완전 제거) ──────────────
function bindButtons() {
  function on(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  }
  on('btn-new',         function(){ newStudent(); });
  on('btn-save',        function(){ saveStudent(); });
  on('btn-del',         function(){ deleteStudent(); });
  on('btn-preview-one',  function(){ printOne(); });
  on('btn-bulk-print',  function(){ openPrint(getChecked()); });
  on('btn-upload-trigger', function(){ openModal('upload-modal'); });
  on('btn-download-template', function(){
    try {
      var byteStr = atob(UPLOAD_TEMPLATE_B64);
      var ab = new ArrayBuffer(byteStr.length);
      var ia = new Uint8Array(ab);
      for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
      var blob = new Blob([ab], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'CHESS_성적표_업로드양식.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('업로드 양식 다운로드가 시작되었어요!');
    } catch(e) {
      showToast('다운로드 중 오류가 발생했어요. 다시 시도해 주세요.');
    }
  });
  on('btn-close-upload',   function(){ closeModal('upload-modal'); });
  on('btn-close-print',    function(){ closePrint(); });
  on('btn-do-print',       function(){ window.print(); });
  on('search-input', null);
  // 드롭존
  var dz = document.getElementById('drop-zone');
  var fi = document.getElementById('file-input');
  if (dz && fi) {
    dz.addEventListener('click', function(){ fi.click(); });
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('over'); });
    dz.addEventListener('drop', function(e){
      e.preventDefault(); dz.classList.remove('over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  }
  if (fi) fi.addEventListener('change', function(){ handleFile(fi.files[0]); });
}
