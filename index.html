<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHESS 입학시험 성적표</title>
<link rel="icon" href="data:,">
<style>
/* Tabler Icons 인라인 대체 - CDN 없이 동작 */
.ti { display:inline-block; font-style:normal; font-size:inherit; line-height:1; }
.ti::before { font-family: sans-serif; }
.ti-plus::before       { content: '+'; font-weight:700; font-size:1.1em; }
.ti-trash::before      { content: '🗑'; font-size:.9em; }
.ti-printer::before    { content: '🖨'; font-size:.9em; }
.ti-device-floppy::before { content: '💾'; font-size:.9em; }
.ti-table-import::before  { content: '📥'; font-size:.9em; }
.ti-file-spreadsheet::before { content: '📊'; font-size:1.1em; }
.ti-file-text::before  { content: '📄'; font-size:1.1em; }
.ti-users::before      { content: '👥'; font-size:1.1em; }
.ti-user::before       { content: '👤'; font-size:1.1em; }
.ti-x::before          { content: '✕'; font-weight:700; }
.ti-chart-bar::before  { content: '📈'; font-size:.9em; }
.ti-building::before   { content: '🏫'; font-size:.9em; }
.ti-map::before        { content: '🗺'; font-size:.9em; }
.ti-message::before    { content: '💬'; font-size:.9em; }
.ti-device-laptop::before { content: '💻'; font-size:.9em; }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a5c;--navy-light:#2d5f8a;--navy-pale:#e8f0f8;
  --blue:#3b82f6;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
  --green:#16a34a;--green-light:#f0fdf4;--green-mid:#bbf7d0;
  --amber:#d97706;--amber-light:#fffbeb;--amber-mid:#fde68a;
  --red:#dc2626;--red-light:#fef2f2;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-700:#374151;--gray-900:#111827;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.04);
  --font-sans:'Noto Sans KR','Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--font-sans);font-size:13px;color:var(--gray-900);background:#f0f4f8;min-height:100vh;}

/* ── 앱 레이아웃 ── */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;background:#fff;box-shadow:var(--shadow-lg);}

/* ── 사이드바 ── */
.sidebar{background:var(--navy);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.sidebar-logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;}
.sidebar-logo-text span{color:#60a5fa;}
.sidebar-logo-sub{font-size:9px;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.5px;display:block;margin-top:1px;}
.sidebar-title{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.sidebar-search{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);color:#fff;font-size:12px;padding:8px 10px;font-family:var(--font-sans);}
.sidebar-search::placeholder{color:rgba(255,255,255,.35);}
.sidebar-search:focus{outline:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);}
.student-list{flex:1;overflow-y:auto;padding:8px;}
.student-list::-webkit-scrollbar{width:4px;}
.student-list::-webkit-scrollbar-track{background:transparent;}
.student-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.student-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:3px;display:flex;align-items:flex-start;gap:8px;transition:all .15s;}
.student-item:hover{background:rgba(255,255,255,.06);}
.student-item.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);}
.student-cb{margin-top:3px;flex-shrink:0;accent-color:#60a5fa;}
.student-info{flex:1;min-width:0;}
.student-name{font-size:12px;font-weight:600;color:#fff;}
.student-meta{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.sidebar-actions{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px;}
.sel-count{font-size:10px;color:rgba(255,255,255,.45);text-align:center;display:none;}
.btn-new{width:100%;font-size:12px;font-weight:600;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-sm);background:#60a5fa;color:#fff;border:none;cursor:pointer;transition:all .15s;letter-spacing:.2px;}
.btn-new:hover{background:#3b82f6;}
.btn-upload{width:100%;font-size:12px;font-weight:500;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:var(--radius-sm);background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .15s;}
.btn-upload:hover{background:rgba(255,255,255,.12);}
.btn-bulk{width:100%;font-size:12px;font-weight:500;font-family:var(--font-sans);display:none;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:var(--radius-sm);background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.2);cursor:pointer;}

/* ── 메인 영역 ── */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--gray-50);}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--gray-200);background:#fff;flex-shrink:0;}
.topbar-title{font-size:14px;font-weight:600;color:var(--gray-900);flex:1;}
.editing-badge{font-size:10px;font-weight:600;background:var(--amber-light);color:var(--amber);padding:3px 10px;border-radius:20px;border:1px solid var(--amber-mid);display:none;letter-spacing:.3px;}
#sync-status{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--gray-100);}
.btn-save{font-size:12px;font-weight:600;padding:7px 16px;display:none;align-items:center;gap:5px;border-radius:var(--radius-sm);background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:var(--font-sans);transition:all .15s;}
.btn-save:hover{background:var(--navy-light);}
.btn-print-one{font-size:12px;font-weight:500;padding:7px 14px;display:none;align-items:center;gap:5px;border-radius:var(--radius-sm);background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);cursor:pointer;font-family:var(--font-sans);transition:all .15s;}
.btn-print-one:hover{background:var(--gray-50);border-color:var(--gray-400);}
.btn-del{font-size:12px;padding:7px 10px;display:none;color:var(--red);background:var(--red-light);border:1px solid #fecaca;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-sans);}
.content{flex:1;overflow-y:auto;padding:20px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-track{background:transparent;}
.content::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px;}

/* ── 폼 섹션 ── */
.form-section{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.form-section:hover{border-color:var(--gray-300);}
.fs-title{font-size:10px;font-weight:700;color:var(--gray-500);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.fs-title i{font-size:14px;color:var(--navy-light);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:10px;color:var(--gray-500);font-weight:600;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{
  font-size:12px;padding:8px 10px;border-radius:var(--radius-sm);
  width:100%;font-family:var(--font-sans);color:var(--gray-900);
  border:1.5px solid var(--gray-200);background:#fff;
  transition:border-color .15s,box-shadow .15s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  outline:none;border-color:#93c5fd;
  box-shadow:0 0 0 3px rgba(59,130,246,.08);
}
.fg textarea{min-height:60px;resize:vertical;line-height:1.6;}
.score-hint{font-size:10px;color:var(--gray-400);margin-top:2px;}
.fg-disabled{opacity:.35;pointer-events:none;}

/* ── 토글 ── */
.toggle-wrap{position:relative;width:36px;height:20px;cursor:pointer;flex-shrink:0;display:inline-block;}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{position:absolute;inset:0;background:var(--gray-300);border-radius:20px;transition:background .2s;}
.toggle-wrap input:checked+.toggle-track{background:var(--navy);}
.toggle-track::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-wrap input:checked+.toggle-track::after{transform:translateX(16px);}

/* ── Pre-Test 섹션 ── */
.pretest-section{border-color:#86efac!important;}
.pretest-section:hover{border-color:#4ade80!important;}
.pretest-title-row{display:flex;align-items:center;gap:6px;margin-bottom:0;}
.pretest-title-text{font-size:10px;font-weight:700;color:#15803d;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex:1;}
.pretest-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-top:12px;}
.pretest-left{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-md);padding:12px;}
.pretest-left-label{font-size:9px;font-weight:700;color:#15803d;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.pretest-body{display:none;}
.pretest-body.visible{display:block;}
.pretest-bar{flex:1;background:var(--gray-200);border-radius:20px;height:8px;overflow:hidden;}
.pretest-bar-fill{height:100%;border-radius:20px;background:#16a34a;transition:width .4s;}
.pretest-pct{font-size:10px;font-weight:700;color:#16a34a;min-width:32px;text-align:right;}
.pretest-sel{font-size:11px;padding:5px 8px;border-radius:var(--radius-sm);border:1.5px solid #bbf7d0;background:#f0fdf4;font-family:var(--font-sans);}

/* ── 오답 버튼 ── */
.wrong-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.wq-btn{
  width:30px;height:30px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);
  transition:all .12s;user-select:none;-webkit-user-select:none;font-family:var(--font-sans);
}
.wq-btn:hover{background:var(--gray-100);border-color:var(--gray-400);color:var(--gray-700);}
.wq-btn.wrong{background:#dc2626;border-color:#b91c1c;color:#fff;box-shadow:0 1px 3px rgba(220,38,38,.3);}
.area-badge{font-size:10px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:4px;display:inline-block;letter-spacing:.2px;}
.avg-section{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--gray-200);display:none;}
.avg-section.visible{display:block;}

/* ── 로드맵 테이블 ── */
.roadmap-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px;border-radius:var(--radius-md);overflow:hidden;}
.roadmap-table th,.roadmap-table td{border:1px solid var(--gray-200);padding:7px 8px;text-align:center;vertical-align:middle;}
.roadmap-table th{background:var(--gray-50);font-size:10px;font-weight:600;color:var(--gray-500);}
.lv-chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.lv-IS{background:#e0e7ff;color:#3730a3}.lv-DS{background:#dcfce7;color:#166534}.lv-LS{background:#fef9c3;color:#854d0e}.lv-MS{background:#fce7f3;color:#9d174d}.lv-ACE{background:#ede9fe;color:#5b21b6}
.badge-now{display:inline-block;background:#f59e0b;color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:2px;}
.badge-grad{display:inline-block;background:#166534;color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:2px;}
.cell-now{background:#fffbeb}.cell-grad{background:#f0fdf4}.cell-ace{background:#faf5ff}.cell-empty{background:var(--gray-50);}

/* ── 모달 ── */
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;align-items:center;justify-content:center;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.modal-wrap.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);padding:24px;width:460px;max-width:96%;box-shadow:var(--shadow-lg);}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--gray-900);}
.modal-sub{font-size:12px;color:var(--gray-500);margin-bottom:16px;line-height:1.6;}
.drop-zone{border:2px dashed var(--gray-300);border-radius:var(--radius-lg);padding:28px;text-align:center;cursor:pointer;margin-bottom:12px;transition:all .15s;}
.drop-zone:hover,.drop-zone.over{background:var(--blue-light);border-color:var(--blue-mid);}
.drop-zone i{font-size:28px;color:var(--gray-400);display:block;margin-bottom:8px;}
.drop-zone p{font-size:12px;color:var(--gray-500);}
.drop-zone input[type=file]{display:none;}
.upload-ok{font-size:12px;padding:10px 14px;border-radius:var(--radius-md);background:var(--green-light);color:var(--green);display:none;white-space:pre-wrap;line-height:1.6;margin-bottom:10px;border:1px solid var(--green-mid);}
.upload-err{font-size:12px;padding:10px 14px;border-radius:var(--radius-md);background:var(--red-light);color:var(--red);display:none;margin-bottom:10px;border:1px solid #fecaca;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.modal-btns button{font-size:12px;font-weight:500;padding:8px 18px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);cursor:pointer;font-family:var(--font-sans);}

/* ── 빈 상태 ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--gray-400);gap:10px;padding:40px;}
.empty i{font-size:36px;opacity:.4;}
.empty p{font-size:13px;color:var(--gray-500);}
.empty-desc{font-size:11px;color:var(--gray-400);text-align:center;line-height:1.7;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:var(--radius-md);font-size:12px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:50;box-shadow:var(--shadow-md);}
.toast.show{opacity:1;}

/* ── 인쇄 오버레이 ── */
.print-overlay{display:none;position:fixed;inset:0;background:#e8eef6;z-index:60;overflow-y:auto;}
.print-overlay.open{display:block;}
.print-toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid #dde5f0;background:#f4f8fc;position:sticky;top:0;z-index:10;}
.ptoolbar-title{font-size:13px;font-weight:600;color:#1a3a5c;flex:1;}
.pbtn{padding:7px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .15s;}
.pbtn-go{background:#1a3a5c;color:#fff;}
.pbtn-go:hover{background:#2d5f8a;}
.pbtn-close{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);}
.print-cards{padding:16px;max-width:860px;margin:0 auto;}

/* ── 성적표 카드 (인쇄용, 기존 유지) ── */
.rc{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #c8d8ec;margin-bottom:14px;}
.rc-hd{background:#1a3a5c;padding:12px 20px;display:flex;align-items:center;gap:10px;}
.rc-logo{font-family:Georgia,serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:1px;}
.rc-logo span{color:#4db8e8;}
.rc-hsub{border-left:1px solid #3a6a8a;padding-left:12px;margin-left:3px;}
.rc-hsub .t{color:#fff;font-size:12px;font-weight:700;}.rc-hsub .s{color:#7aaac8;font-size:9px;margin-top:1px;}
.rc-badge{margin-left:auto;background:#2d5f8a;color:#a8d0ec;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 9px;border-radius:12px;}
.rc-ig{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rc-ih{background:#2d5f8a;color:#c8dff0;font-size:9px;font-weight:500;text-align:center;padding:5px;letter-spacing:.8px;}
.rc-iv{text-align:center;padding:8px 6px;font-size:11px;font-weight:600;color:#1a3a5c;border-right:1px solid #dde5f0;border-bottom:1px solid #dde5f0;}
.rc-iv:last-child{border-right:none;}
.rc-tg{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rc-th{background:#3a7abf;color:#d0e8fa;font-size:9px;font-weight:500;text-align:center;padding:5px;}
.rc-tv{text-align:center;padding:8px 6px;font-size:11px;color:#2c5282;border-right:1px solid #dde5f0;border-bottom:2px solid #1a3a5c;}
.rc-tv:last-child{border-right:none;}
.rc-tn{font-size:22px;font-weight:700;color:#1a3a5c;font-family:Georgia,serif;}
.rc-dn{font-size:12px;font-weight:600;color:#3a7abf;}
.rc-sec{padding:11px 16px 9px;}
.rc-st{font-size:12px;font-weight:700;color:#1a3a5c;border-left:3px solid #3a7abf;padding-left:7px;margin-bottom:9px;}
.rc-div{height:1px;background:#dde5f0;margin:0 16px;}
.rc-ct{width:100%;border-collapse:collapse;}.rc-ct tr{border-bottom:1px solid #edf2f8;}
.rc-lt{width:100%;border-collapse:collapse;font-size:10px;}
.rc-lt th{padding:5px 8px;font-weight:600;text-align:center;background:#2d7a4f;color:#c8f0da;}
.rc-lt td{padding:7px 8px;text-align:center;border-right:1px solid #dde5f0;color:#1a3a5c;font-weight:500;}
.rc-lt td:last-child{border-right:none;}
.rc-lb{display:inline-block;background:#1a3a5c;color:#fff;padding:2px 8px;border-radius:12px;font-weight:700;font-size:10px;}
.rc-nb{background:#f8fbff;border:1px solid #c8ddf0;border-radius:6px;padding:9px 12px;font-size:10px;color:#3a5a7a;line-height:1.8;white-space:pre-wrap;}
.rc-ft{background:#1a3a5c;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.rc-rmt{width:100%;border-collapse:collapse;font-size:9px;}
.rc-rmt th,.rc-rmt td{border:1px solid #c8d8ec;padding:4px 5px;text-align:center;vertical-align:middle;}
.rc-rmt th{background:#eaf2fb;font-weight:600;color:#1a3a5c;}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px;}
.ac{border:1px solid #c8d8ec;border-radius:7px;overflow:hidden;}
.ac-hd{padding:7px 10px;display:flex;align-items:center;justify-content:space-between;}
.ac-title{font-size:10px;font-weight:700;color:#fff;}
.ac-sb{font-size:9px;color:#fff;background:rgba(255,255,255,.25);padding:1px 7px;border-radius:8px;}
.ac-bd{padding:7px 10px;}
.ac-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.ac-lbl{font-size:9px;color:#3a5a7a;width:56px;flex-shrink:0;}
.ac-bar{flex:1;background:#edf2f8;border-radius:20px;height:9px;overflow:hidden;}
.ac-fill{height:100%;border-radius:20px;}
.ac-pct{font-size:9px;font-weight:700;width:30px;text-align:right;flex-shrink:0;}
.wrong-tags{margin-top:4px;line-height:1.6;}
.wrong-tag{display:inline-block;background:#fed7d7;color:#c53030;padding:0 3px;border-radius:3px;margin:1px;font-size:8px;}
.ac-skills{margin-top:4px;font-size:9px;color:#5a7a9a;line-height:1.6;}
.ac-comment{font-size:9px;color:#3a5a7a;line-height:1.5;margin-top:5px;padding-top:4px;border-top:.5px solid #edf2f8;}
.overall-box{background:#f0f6fc;border:1px solid #b5d4f0;border-radius:6px;padding:8px 12px;display:flex;gap:8px;}
.overall-icon{font-size:16px;flex-shrink:0;}
.overall-text{font-size:10px;color:#1a3a5c;line-height:1.6;}
.overall-text strong{display:block;font-size:11px;margin-bottom:2px;}
.pg-break{page-break-after:always;height:1px;}


/* ── 폴더 토글 ── */
.folder-wrap{margin-bottom:4px;}
.folder-hd{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;border-radius:6px;transition:background .15s;}
.folder-hd:hover{background:rgba(255,255,255,.08);}
.folder-chevron{font-size:9px;color:rgba(255,255,255,.5);transition:transform .2s;display:inline-block;flex-shrink:0;}
.folder-chevron.open{transform:rotate(90deg);}
.folder-body{display:none;padding-left:4px;}
.folder-body.open{display:block;}
.folder-acts{margin-left:auto;display:flex;gap:3px;}
.folder-act{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.5);border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.folder-act:hover{background:rgba(255,255,255,.18);color:#fff;}
.folder-act.del:hover{background:rgba(220,38,38,.4);color:#fff;}
.drop-target{min-height:10px;border-radius:6px;transition:background .15s;}
.drop-target.drag-over{background:rgba(96,165,250,.15);outline:2px dashed rgba(96,165,250,.4);}
.student-item.dragging{opacity:.4;}

/* ── 설문 체크박스 ── */
.sv-checks{display:flex;flex-wrap:wrap;gap:6px;}
.sv-check-label{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--gray-700);background:#fff;border:1px solid #d1d5db;border-radius:20px;padding:4px 10px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;}
.sv-check-label:hover{border-color:#93c5fd;background:#eff6ff;}
.sv-check-label input[type=checkbox]{accent-color:#3b82f6;width:13px;height:13px;cursor:pointer;flex-shrink:0;}
.sv-check-label:has(input:checked){background:#eff6ff;border-color:#3b82f6;color:#1d4ed8;}

@media print{
  .print-toolbar{display:none!important;}
  .print-cards{padding:0!important;max-width:100%!important;}
  .rc{border-radius:0!important;margin-bottom:0!important;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<body>
<div class="app" id="app-main">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text"><span>C</span>HESS</div>
        <span class="sidebar-logo-sub">정상어학원 입학시험 성적표 관리</span>
      </div>
      <div class="sidebar-title">학생 목록 <span id="total-count"></span></div>
      <input type="text" id="search-input" class="sidebar-search" placeholder="이름·코드 검색..." oninput="filterStudents()">
    </div>
    <div class="student-list" id="student-list"></div>
    <div class="sidebar-actions">
      <div class="sel-count" id="sel-count"></div>
      <button class="btn-bulk" id="btn-bulk-print"><i class="ti ti-printer"></i>선택 일괄 인쇄</button>
      <button class="btn-add-folder" id="btn-add-folder">📁 학기 폴더 추가</button>
      <button class="btn-upload" id="btn-upload-trigger"><i class="ti ti-table-import"></i>엑셀 업로드</button>
      <button class="btn-upload" id="btn-download-template" style="background:#f0fdf4;color:#16a34a;border-color:#86efac;"><i class="ti ti-file-spreadsheet"></i>업로드 양식 다운로드</button>
      <button class="btn-new" id="btn-new"><i class="ti ti-plus"></i>새 학생 추가</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">학생을 선택하거나 새로 추가하세요</div>
      <span id="sync-status" style="font-size:11px;padding:3px 10px;border-radius:20px;background:var(--gray-100)"></span>
      <span class="editing-badge" id="editing-badge">수정 중</span>
      <button class="btn-print-one" id="btn-preview-one" style="display:none;font-size:12px;font-weight:500;padding:7px 14px;align-items:center;gap:5px;border-radius:var(--radius-sm);background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);cursor:pointer;font-family:var(--font-sans);transition:all .15s;"><i class="ti ti-file-text"></i>성적표 미리보기(인쇄)</button>
      <button class="btn-del" id="btn-del"><i class="ti ti-trash"></i></button>
      <button class="btn-save" id="btn-save"><i class="ti ti-device-floppy"></i>저장</button>
    </div>
    <div class="content" id="main-content">
      <div class="empty"><i class="ti ti-users"></i><p>학생을 선택하거나 새로 추가하세요</p><p class="empty-desc">좌측 목록에서 선택하거나 새 학생을 추가해주세요</p></div>
    </div>
  </main>
</div>

<div class="modal-wrap" id="upload-modal">
  <div class="modal">
    <div class="modal-title">엑셀 일괄 업로드</div>
    <div class="modal-sub">.xlsx 또는 .csv 파일을 올려주세요. (CSV 권장 — 엑셀에서 편집 가능)</div>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".xlsx,.xls">
      <i class="ti ti-file-spreadsheet"></i><p>클릭하거나 파일을 드래그하세요</p><p style="font-size:11px;margin-top:4px;color:#9ca3af">.xlsx / .csv 모두 지원</p>
    </div>
    <div class="upload-ok" id="upload-ok"></div>
    <div class="upload-err" id="upload-err"></div>
    <div class="modal-btns"><button id="btn-close-upload">닫기</button></div>
  </div>
</div>

<div class="print-overlay" id="print-overlay">
  <div class="print-toolbar">
    <div class="ptoolbar-title" id="print-title">성적표 미리보기</div>
    <button class="pbtn pbtn-close" id="btn-close-print"><i class="ti ti-x"></i>닫기</button>
    <button class="pbtn pbtn-go" id="btn-do-print"><i class="ti ti-printer"></i>인쇄 / PDF 저장</button>
  </div>
  <div class="print-cards" id="print-cards"></div>
</div>
<div class="toast" id="toast"></div>

function monthToSem(m){if(m>=12||m<=2)return 12;if(m>=3&&m<=5)return 3;if(m>=6&&m<=8)return 6;return 9;}
function parseStart(raw){if(!raw)return'';var s=String(raw).trim();if(s==='즉시')return'즉시';var a=s.match(/^(\d{1,2})월/);if(a)return String(monthToSem(+a[1]));var b=s.match(/^(\d{1,2})[\/\-.]/);if(b)return String(monthToSem(+b[1]));var c=s.match(/^(\d{1,2})$/);if(c&&+c[1]>=1&&+c[1]<=12)return String(monthToSem(+c[1]));return'즉시';}
function buildStartOpts(ds,sel){sel=sel||'';if(!ds)return'';var m=new Date(ds).getMonth()+1,near=null,md=99;SEM_START.forEach(function(sm){var d=Math.abs(m-sm);if(d>6)d=12-d;if(d<=1&&d<md){md=d;near=sm;}});var ord;if(near!==null){var i=SEM_START.indexOf(near);ord=SEM_START.map(function(_,j){return SEM_START[(i+j)%4];});}else{var ci=m>=3&&m<=5?1:m>=6&&m<=8?2:m>=9&&m<=11?3:0;var ni=(ci+1)%4;ord=SEM_START.map(function(_,j){return SEM_START[(ni+j)%4];});}var sv=String(sel);return['<option value="즉시"'+(sv==='즉시'?' selected':'')+'>즉시</option>'].concat(ord.map(function(sm){return'<option value="'+sm+'"'+(sv==sm?' selected':'')+'>'+SEM_LABELS[sm]+'</option>';})).join('');}

// ── GAS 통신 ─────────────────────────────────────────────────
function showSyncStatus(msg,color){var el=document.getElementById('sync-status');if(el){el.textContent=msg;el.style.color=color||'#6b7280';}}

function gasJsonp(params){
  return new Promise(function(resolve){
    var cbName='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    var script=document.createElement('script');
    var timer=setTimeout(function(){
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
      resolve({ok:false,error:'timeout'});
    },15000);
    window[cbName]=function(data){
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
      resolve(data);
    };
    var qs='callback='+cbName+'&t='+Date.now();
    Object.keys(params).forEach(function(k){
      qs+='&'+k+'='+encodeURIComponent(typeof params[k]==='object'?JSON.stringify(params[k]):String(params[k]));
    });
    script.src=GAS_URL+'?'+qs;
    script.onerror=function(){clearTimeout(timer);delete window[cbName];resolve({ok:false,error:'network error'});};
    document.body.appendChild(script);
  });
}
function gasGet(){return gasJsonp({action:'list'});}
function gasPost(data){
  var params={action:data.action};
  if(data.student)params.data=data.student;
  if(data.students)params.data=data.students;
  if(data.id)params.id=data.id;
  return gasJsonp(params);
}
function gasDelete(id){return gasJsonp({action:'delete',id:id});}

// ── 스토리지 ────────────────────────────────────────────────
function loadStudents(){
  try { loadFolders(); } catch(e) {}  // 폴더 독립 로드 (실패해도 무관)
  showSyncStatus('⏳ 불러오는 중...','#d97706');
  gasGet().then(function(res){
    if(res.ok&&res.students){
      students=res.students;
      students.sort(function(a,b){return(b.updatedAt||0)-(a.updatedAt||0);});
      showSyncStatus('✓ '+students.length+'명 불러옴','#16a34a');
    }else{
      showSyncStatus('⚠ 불러오기 실패','#dc2626');
    }
    renderSidebar();
    setTimeout(function(){showSyncStatus('','');},3000);
  });
}
function persist(s){
  showSyncStatus('💾 저장 중...','#d97706');
  gasPost({action:'save',student:s}).then(function(res){
    if(res.ok)showSyncStatus('✓ 저장 완료','#16a34a');
    else showSyncStatus('⚠ 저장 실패: '+(res.error||''),'#dc2626');
    setTimeout(function(){showSyncStatus('','');},3000);
  });
}
function persistAll(list){
  showSyncStatus('💾 '+list.length+'명 저장 중...','#d97706');
  gasPost({action:'saveAll',students:list}).then(function(res){
    if(res.ok)showSyncStatus('✓ '+list.length+'명 저장 완료','#16a34a');
    else showSyncStatus('⚠ 저장 실패','#dc2626');
    setTimeout(function(){showSyncStatus('','');},3000);
  });
}

// ── 사이드바 ────────────────────────────────────────────────

var folders = [];
var _dragId = null;

function loadFolders() {
  // 로컬에서 즉시 로드
  try {
    var raw = localStorage.getItem('chess_folders');
    folders = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(folders)) folders = [];
  } catch(e) { folders = []; }
  // GAS에서 비동기 동기화 (실패해도 앱 동작에 영향 없음)
  gasJsonp({ action: 'getFolders' }).then(function(res) {
    if (res.ok && Array.isArray(res.folders)) {
      folders = res.folders;
      try { localStorage.setItem('chess_folders', JSON.stringify(folders)); } catch(e) {}
      renderSidebar();
    }
  }).catch(function() {
    // 실패해도 무시 - 로컬 폴더 유지
  });
}

function saveFolders() {
  // 로컬 저장
  try { localStorage.setItem('chess_folders', JSON.stringify(folders)); } catch(e) {}
  // 구글 시트 동기화
  gasJsonp({ action: 'saveFolders', data: folders }).then(function(res) {
    if (!res.ok) console.log('폴더 저장 실패:', res.error);
  });
}

function addFolder() {
  var name = prompt('새 폴더 이름을 입력하세요\n예) 2026년 6월 학기', '');
  if (!name || !name.trim()) return;
  folders.push({ id: 'f_' + Date.now(), name: name.trim(), open: true });
  saveFolders();
  renderSidebar();
}

function renameFolder(id) {
  var f = folders.find(function(x){ return x.id === id; });
  if (!f) return;
  var name = prompt('폴더 이름 변경', f.name);
  if (!name || !name.trim()) return;
  f.name = name.trim();
  saveFolders();
  renderSidebar();
}

function deleteFolder(id) {
  var f = folders.find(function(x){ return x.id === id; });
  if (!f) return;
  var cnt = students.filter(function(s){ return s.folder === id; }).length;
  var msg = cnt > 0
    ? '폴더 안에 학생 ' + cnt + '명이 있어요.\n삭제하면 미분류로 이동해요. 계속할까요?'
    : '폴더를 삭제할까요?';
  if (!confirm(msg)) return;
  students.forEach(function(s){
    if (s.folder === id) { s.folder = ''; gasPost({ action: 'save', student: s }); }
  });
  folders = folders.filter(function(x){ return x.id !== id; });
  saveFolders();
  renderSidebar();
}

function toggleFolderOpen(id) {
  if (id === '__unc__') {
    window._uncOpen = window._uncOpen === false ? true : false;
    renderSidebar();
    return;
  }
  var f = folders.find(function(x){ return x.id === id; });
  if (f) { f.open = !f.open; saveFolders(); }
  renderSidebar();
}

function moveToFolder(sid, fid) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  s.folder = fid;
  s.updatedAt = Date.now();
  persist(s);
  renderSidebar();
  showToast('폴더로 이동했어요!');
}

function attachSidebarDelegation() {
  var list = document.getElementById('student-list');
  if (!list || list._del) return;
  list._del = true;

  list.addEventListener('click', function(e) {
    if (e.target.classList.contains('student-cb')) { onCbChange(); return; }
    var info = e.target.closest('.student-info');
    if (info) { selectStudent(info.getAttribute('data-sid')); return; }
    var hd = e.target.closest('.folder-hd');
    if (hd) {
      var act = e.target.closest('.folder-act');
      if (act) {
        e.stopPropagation();
        var fid = act.getAttribute('data-fid');
        if (act.classList.contains('del')) deleteFolder(fid);
        else renameFolder(fid);
        return;
      }
      toggleFolderOpen(hd.getAttribute('data-fid'));
      return;
    }
  });

  list.addEventListener('dragstart', function(e) {
    // student-item 또는 그 하위 요소에서 드래그 시작
    var item = e.target.closest('.student-item[draggable]');
    if (!item) return;
    _dragId = item.getAttribute('data-sid');
    if (!_dragId) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _dragId);
    setTimeout(function(){ item.classList.add('dragging'); }, 0);
  });
  list.addEventListener('dragend', function() {
    _dragId = null;
    list.querySelectorAll('.student-item').forEach(function(el){ el.classList.remove('dragging'); });
    list.querySelectorAll('.drop-target').forEach(function(el){ el.classList.remove('drag-over'); });
  });
  list.addEventListener('dragover', function(e) {
    var zone = e.target.closest('.drop-target');
    if (!zone || !_dragId) return;
    e.preventDefault();
    list.querySelectorAll('.drop-target').forEach(function(el){ el.classList.remove('drag-over'); });
    zone.classList.add('drag-over');
  });
  list.addEventListener('dragleave', function(e) {
    var zone = e.target.closest('.drop-target');
    if (zone) zone.classList.remove('drag-over');
  });
  list.addEventListener('drop', function(e) {
    var zone = e.target.closest('.drop-target');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over');
    var sid = _dragId || e.dataTransfer.getData('text/plain');
    if (!sid) return;
    var fid = zone.getAttribute('data-fid');
    moveToFolder(sid, fid === '__none__' ? '' : fid);
    _dragId = null;
  });

  var addBtn = document.getElementById('btn-add-folder');
  if (addBtn && !addBtn._evt) {
    addBtn._evt = true;
    addBtn.addEventListener('click', addFolder);
  }
}

function renderSidebar() {
  document.getElementById('total-count').textContent = students.length ? '(' + students.length + '명)' : '';
  var list = document.getElementById('student-list');
  var qEl = document.getElementById('search-input');
  var q = qEl ? qEl.value.trim().toLowerCase() : '';
  var html = '';

  function mkItem(s) {
    var match = !q || (s.name||'').toLowerCase().indexOf(q) >= 0 || (s.memberCode||'').toLowerCase().indexOf(q) >= 0;
    if (!match) return '';
    var active = s.id === currentId ? ' active' : '';
    return '<div class="student-item' + active + '" id="si-' + s.id + '" data-sid="' + s.id + '" draggable="true">'
      + '<input type="checkbox" class="student-cb" id="cb-' + s.id + '">'
      + '<div class="student-info" data-sid="' + s.id + '">'
        + '<div class="student-name">' + (s.name || '이름 없음')
          + (s.memberCode ? '<span style="font-size:9px;color:rgba(255,255,255,.35);margin-left:4px">' + s.memberCode + '</span>' : '')
        + '</div>'
        + '<div class="student-meta">' + (s.testLevel || '—') + ' · ' + (s.grade ? '초등' + s.grade + '학년' : '학년미정') + '</div>'
      + '</div>'
    + '</div>';
  }

  folders.forEach(function(f) {
    var fStu = students.filter(function(s){ return s.folder === f.id; });
    var vis = fStu.filter(function(s){
      return !q || (s.name||'').toLowerCase().indexOf(q) >= 0 || (s.memberCode||'').toLowerCase().indexOf(q) >= 0;
    });
    if (q && vis.length === 0) return;
    var isOpen = f.open !== false;
    var body = vis.length === 0 && !q
      ? '<div style="padding:8px;font-size:10px;color:rgba(255,255,255,.2);text-align:center">드래그로 학생 추가</div>'
      : vis.map(mkItem).join('');
    html += '<div class="folder-wrap">'
      + '<div class="folder-hd" data-fid="' + f.id + '">'
        + '<span class="folder-chevron' + (isOpen ? ' open' : '') + '">&#9654;</span>'
        + '<span style="font-size:13px">&#128193;</span>'
        + '<span class="folder-label" style="color:#93c5fd;font-weight:700;">' + f.name + '</span>'
        + '<span class="folder-cnt" style="color:#93c5fd;">&nbsp;&nbsp;[' + fStu.length + '명]</span>'
        + '<div class="folder-acts">'
          + '<button class="folder-act" data-fid="' + f.id + '" title="이름 변경">&#9998;</button>'
          + '<button class="folder-act del" data-fid="' + f.id + '" title="삭제">&#10005;</button>'
        + '</div>'
      + '</div>'
      + '<div class="folder-body' + (isOpen ? ' open' : '') + '">'
        + '<div class="drop-target" data-fid="' + f.id + '">' + body + '</div>'
      + '</div>'
    + '</div>';
  });

  var uncOpen = window._uncOpen !== false;
  var uncat = students.filter(function(s){ return !s.folder || s.folder === ''; });
  var uncVis = uncat.filter(function(s){
    return !q || (s.name||'').toLowerCase().indexOf(q) >= 0 || (s.memberCode||'').toLowerCase().indexOf(q) >= 0;
  });
  if (!q || uncVis.length > 0) {
    var uncBody = uncVis.length === 0
      ? '<div style="padding:8px;font-size:10px;color:rgba(255,255,255,.2);text-align:center">드래그로 이동</div>'
      : uncVis.map(mkItem).join('');
    html += '<div class="folder-wrap">'
      + '<div class="folder-hd" data-fid="__unc__">'
        + '<span class="folder-chevron' + (uncOpen ? ' open' : '') + '">&#9654;</span>'
        + '<span style="font-size:13px">&#128203;</span>'
        + '<span class="folder-label" style="color:#93c5fd;font-weight:700;">미분류</span>'
        + '<span class="folder-cnt" style="color:#93c5fd;">&nbsp;&nbsp;[' + uncat.length + '명]</span>'
      + '</div>'
      + '<div class="folder-body' + (uncOpen ? ' open' : '') + '">'
        + '<div class="drop-target" data-fid="__none__">' + uncBody + '</div>'
      + '</div>'
    + '</div>';
  }

  if (!html && !students.length) {
    html = '<div style="padding:14px;font-size:12px;color:rgba(255,255,255,.4);text-align:center">등록된 학생이 없어요</div>';
  }
  list.innerHTML = html || '<div style="padding:14px;font-size:12px;color:rgba(255,255,255,.4);text-align:center">검색 결과 없음</div>';
  attachSidebarDelegation();
}

function filterStudents(){
  var q=document.getElementById('search-input').value.trim().toLowerCase();
  document.querySelectorAll('.student-item').forEach(function(el){
    el.style.display=(!q||el.dataset.name.indexOf(q)>=0||el.dataset.code.indexOf(q)>=0)?'':'none';
  });
}

function onCbChange(){
  var n=document.querySelectorAll('.student-cb:checked').length;
  document.getElementById('sel-count').style.display=n?'block':'none';
  document.getElementById('sel-count').textContent=n+'명 선택됨';
  document.getElementById('btn-bulk').style.display=n?'flex':'none';
}
function getChecked(){return students.filter(function(s){var el=document.getElementById('cb-'+s.id);return el&&el.checked;});}

// ── CRUD ────────────────────────────────────────────────────
function newStudent(){
  if(isDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 계속하시겠어요?'))return;
  currentId='s_'+Date.now();
  isDirty=false;
  renderForm({id:currentId});
  setTimeout(function(){var el=document.getElementById('f-name');if(el)el.focus();},50);
}

function selectStudent(id){
  if(isDirty&&currentId!==id&&!confirm('저장하지 않은 변경사항이 있습니다. 계속하시겠어요?'))return;
  currentId=id;isDirty=false;
  renderForm(students.find(function(x){return x.id===id;})||{id:id});
  renderSidebar();
}

function saveStudent(){
  var s=collectForm();
  if(!s){showToast('학생명을 입력해 주세요.');return;}
  s.updatedAt=Date.now();
  var ex=students.find(function(x){return x.id===currentId;});
  if(ex)Object.assign(ex,s);else students.unshift(s);
  isDirty=false;
  document.getElementById('editing-badge').style.display='none';
  document.getElementById('btn-del').style.display='flex';
  renderSidebar();
  persist(s);
}

function deleteStudent(){
  if(!currentId||!confirm('삭제할까요?'))return;
  var delId=currentId;
  gasDelete(delId).then(function(res){
    if(!res.ok){showToast('삭제 실패: '+(res.error||''));return;}
    students=students.filter(function(x){return x.id!==delId;});
    currentId=null;isDirty=false;renderSidebar();showEmpty();
    showToast('삭제됐어요!');
  });
}

function markDirty(){isDirty=true;document.getElementById('editing-badge').style.display='';}



// ── renderForm 헬퍼 함수들 ─────────────────────────────────────

function buildScoreFields(cfg, scores) {
  scores = scores || {};
  if (!cfg) return '';
  var h = '';
  for (var n = 1; n <= 4; n++) {
    var k = 'a' + n;
    var area = null;
    for (var i = 0; i < cfg.areas.length; i++) {
      if (cfg.areas[i].n === n) { area = cfg.areas[i]; break; }
    }
    var val = scores[k] !== undefined ? scores[k] : '';
    if (area) {
      h += '<div class="fg"><label>영역' + n + ' · ' + area.name + '</label>'
        + '<input type="number" id="sc-' + k + '" min="0" max="' + area.max + '" value="' + val + '" placeholder="0~' + area.max + '" oninput="markDirty()">'
        + '<div class="score-hint">배점 ' + area.max + '점</div></div>';
    } else {
      h += '<div class="fg fg-disabled"><label>영역' + n + '</label><input type="number" disabled placeholder="해당 없음"></div>';
    }
  }
  return h;
}

function buildWrongFields(cfg, wrongs) {
  wrongs = wrongs || [];
  if (!cfg) return '<div style="font-size:12px;color:var(--gray-500)">시험지 레벨을 먼저 선택해 주세요.</div>';
  var id = currentId || 'tmp';
  var html = '';
  cfg.areas.forEach(function(area) {
    var clr = area.color || '#2b6cb0';
    var btns = '';
    area.qs.forEach(function(q) {
      var isW = wrongs.indexOf(q) >= 0;
      var cls = 'wq-btn' + (isW ? ' wrong' : '');
      btns += '<button class="' + cls + '" id="wq-' + id + '-' + q + '">' + q + '</button>';
    });
    html += '<div style="margin-bottom:7px">'
      + '<span class="area-badge" style="background:' + clr + '22;color:' + clr + ';border:0.5px solid ' + clr + '44">' + area.name + '</span>'
      + '<div class="wrong-grid" data-area="' + area.key + '">' + btns + '</div>'
      + '</div>';
  });
  return html;
}

function buildAvgFields(cfg, avgs, avgMode) {
  if (!cfg) return '';
  avgs = avgs || {};
  avgMode = avgMode || 'score'; // 'score' or 'pct'
  var h = '';
  for (var n = 1; n <= 4; n++) {
    var k = 'a' + n;
    var area = null;
    for (var i = 0; i < cfg.areas.length; i++) {
      if (cfg.areas[i].n === n) { area = cfg.areas[i]; break; }
    }
    if (area) {
      var av = avgs[k] !== undefined ? avgs[k] : '';
      // 퍼센티지 모드면 저장된 점수를 % 로 역산해서 보여줌
      var displayVal = '';
      if (av !== '') {
        displayVal = avgMode === 'pct'
          ? Math.round(av / area.max * 1000) / 10
          : av;
      }
      if (avgMode === 'score') {
        h += '<div class="fg"><label>영역' + n + ' 평균 · ' + area.name + '<span style="color:var(--gray-400);font-weight:400;margin-left:4px">/ ' + area.max + '점</span></label>'
          + '<input type="number" id="av-' + k + '" value="' + displayVal + '" placeholder="0~' + area.max + '" min="0" max="' + area.max + '" oninput="limitAvgInput(this,' + area.max + ');markDirty()"></div>';
      } else {
        h += '<div class="fg"><label>영역' + n + ' 평균 · ' + area.name + '<span style="color:var(--gray-400);font-weight:400;margin-left:4px">→ ' + area.max + '점 기준</span></label>'
          + '<div style="position:relative">'
          + '<input type="number" id="av-' + k + '" value="' + displayVal + '" placeholder="0~100" min="0" max="100" step="0.1" oninput="limitAvgInput(this,100);updatePctHint(\'' + k + '\',' + area.max + ');markDirty()" style="padding-right:56px">'
          + '<span id="pct-hint-' + k + '" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--gray-400);pointer-events:none">'
          + (displayVal !== '' ? '≈' + Math.round(parseFloat(displayVal) / 100 * area.max * 10) / 10 + '점' : '') + '</span>'
          + '</div></div>';
      }
    } else {
      h += '<div class="fg fg-disabled"><label>영역' + n + ' 평균</label><input type="number" disabled placeholder="—"></div>';
    }
  }
  return h;
}

function updatePctHint(k, max) {
  var el = document.getElementById('av-' + k);
  var hint = document.getElementById('pct-hint-' + k);
  if (!el || !hint) return;
  var v = parseFloat(el.value);
  hint.textContent = isNaN(v) ? '' : '≈' + Math.round(v / 100 * max * 10) / 10 + '점';
}

function switchAvgMode(mode) {
  var lv = document.getElementById('f-level') && document.getElementById('f-level').value;
  var cfg = window.LEVEL_CFG && window.LEVEL_CFG[lv];
  if (!cfg) return;
  // 현재 입력값을 점수로 변환해서 보존
  var avgs = collectAvgs(cfg, document.getElementById('avg-mode-current') && document.getElementById('avg-mode-current').value || 'score');
  // 모드 버튼 UI 업데이트
  document.getElementById('avg-mode-current').value = mode;
  ['avg-btn-score','avg-btn-pct'].forEach(function(id){
    var btn = document.getElementById(id);
    if (!btn) return;
    var active = (id === 'avg-btn-score' && mode === 'score') || (id === 'avg-btn-pct' && mode === 'pct');

    btn.style.borderColor = active ? 'var(--navy)' : 'var(--gray-300)';
  });
  // 필드 재렌더
  var af = document.getElementById('avg-fields');
  if (af) af.innerHTML = buildAvgFields(cfg, avgs, mode);

}

function collectAvgs(cfg, currentMode) {
  // 현재 모드에 맞게 입력값을 실제 점수로 변환해 반환
  var avgs = {};
  currentMode = currentMode || 'score';
  cfg.areas.forEach(function(a) {
    var el = document.getElementById('av-' + a.key);
    if (!el || el.value === '') return;
    var v = parseFloat(el.value);
    if (isNaN(v)) return;
    avgs[a.key] = currentMode === 'pct' ? Math.round(v / 100 * a.max * 10) / 10 : v;
  });
  return avgs;
}

function limitAvgInput(el, max) {
  var v = parseFloat(el.value);
  if (isNaN(v)) return;
  if (v < 0) el.value = 0;
  if (v > max) { el.value = max; showToast('최대 ' + max + (max === 100 ? '%' : '점') + '까지 입력할 수 있어요.'); }
}

function toggleWrong(areaKey, q) {
  var btn = document.getElementById('wq-' + currentId + '-' + q);
  if (!btn) return;
  var isCurrentlyWrong = btn.classList.contains('wrong');
  if (!isCurrentlyWrong) {
    var lv = document.getElementById('f-level') && document.getElementById('f-level').value;
    var cfg = LEVEL_CFG[lv];
    var area = cfg && cfg.areas.find(function(a) { return a.key === areaKey; });
    if (area) {
      var inputScoreEl = document.getElementById('sc-' + areaKey);
      var inputScore = inputScoreEl ? parseFloat(inputScoreEl.value) : null;
      if (inputScore != null && !isNaN(inputScore)) {
        var lostPts = area.max - inputScore;
        var minPtPerQ = Math.round(area.max / area.qs.length);
        if (minPtPerQ < 1) minPtPerQ = 1;
        var maxWrongAllowed = Math.floor(lostPts / minPtPerQ);
        var currentWrongCount = area.qs.filter(function(qn) {
          var b = document.getElementById('wq-' + currentId + '-' + qn);
          return b && b.classList.contains('wrong');
        }).length;
        if (currentWrongCount >= maxWrongAllowed) {
          showToast('입력한 점수(' + inputScore + '점)로는 오답을 최대 ' + maxWrongAllowed + '개까지 체크할 수 있어요.');
          return;
        }
      }
    }
  }
  btn.classList.toggle('wrong');
  markDirty();
}

function onDateInput(el) {
  var v = el.value;
  var raw = v.replace(/[^0-9]/g, '');
  if (raw.length >= 8) {
    var formatted = raw.slice(0,4) + '-' + raw.slice(4,6) + '-' + raw.slice(6,8);
    var d = new Date(formatted);
    if (!isNaN(d.getTime())) {
      el.value = formatted;
      onDateChange();
      return;
    }
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
    onDateChange();
  }
}

function onDateInput(el){
  var v = el.value;
  var raw = v.replace(/[^0-9]/g,'');
  if(raw.length >= 8){
    var formatted = raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
    var d = new Date(formatted);
    if(!isNaN(d.getTime())){
      el.value = formatted;
      onDateChange();
      return;
    }
  }
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){
    onDateChange();
  }
}

function renderRoadmap(s){
  var wrap=document.getElementById('roadmap-wrap');if(!wrap)return;
  var grade=parseInt((s&&s.grade)||document.getElementById('f-grade')&&document.getElementById('f-grade').value||'');
  var dateStr=(s&&s.testDate)||document.getElementById('f-date')&&document.getElementById('f-date').value||'';
  var sv=(s&&s.startSem)||document.getElementById('f-start')&&document.getElementById('f-start').value||'';
  var chess=(s&&s.chessLevel)||document.getElementById('f-chess')&&document.getElementById('f-chess').value||'';
  if(!grade||!dateStr||!chess||!sv){wrap.innerHTML='<div style="font-size:12px;color:var(--color-text-secondary)">학년, 시험일, 수업시작, 배치 레벨을 모두 입력하면 자동 생성됩니다.</div>';return;}
  var startSem;if(sv==='즉시')startSem=dateToSem(dateStr);else{var sm=+sv,y=new Date(dateStr).getFullYear(),tm=new Date(dateStr).getMonth()+1,map={12:0,3:1,6:2,9:3},sy=y;if(sm<tm&&!(sm===12&&tm<=2))sy=y+1;startSem={year:sy,semIdx:map[sm]};}
  if(!startSem)return;var si=-1;for(var i=0;i<ALL_SUBS.length;i++)if(ALL_SUBS[i].sub===chess){si=i;break;}if(si<0)return;
  var ste=(5-grade)*4+(3-startSem.semIdx),cm={};
  for(var i2=0;i2<=ste;i2++){var sem=addSems(startSem,i2),sub=ALL_SUBS[si+i2];if(!sub)break;cm[(grade+Math.floor((startSem.semIdx+i2)/4))+'-'+sem.semIdx]={sub:sub.sub,stage:sub.stage,isNow:i2===0,isLast:i2===ste};}
  var as=addSems(startSem,ste+1),ag=grade+Math.floor((startSem.semIdx+ste+1)/4);cm[ag+'-'+as.semIdx]={isAce:true};
  var html='<table class="roadmap-table"><thead><tr><th>학년</th><th>12월~2월</th><th>3월~5월</th><th>6월~8월</th><th>9월~11월</th></tr></thead><tbody>';
  for(var g=grade;g<=Math.min(6,ag);g++){html+='<tr><th style="font-weight:500">'+(g<=5?'초등 '+g+'학년':'초등 6학년~')+'</th>';for(var si2=0;si2<=3;si2++){var c=cm[g+'-'+si2];if(!c)html+='<td class="cell-empty">—</td>';else if(c.isAce)html+='<td class="cell-ace"><span class="lv-chip lv-ACE">ACE 진급</span></td>';else html+='<td class="'+(c.isNow?'cell-now':c.isLast?'cell-grad':'')+'"><span class="lv-chip lv-'+c.stage+'">'+c.sub+'</span>'+(c.isNow?'<br><span class="badge-now">수업시작</span>':'')+(c.isLast?'<br><span class="badge-grad">졸업</span>':'')+'</td>';}html+='</tr>';}
  wrap.innerHTML=html+'</tbody></table>';
}

// ── 패턴 감지 ──────────────────────────────────────────────────
function detectPatterns(testLevel, wrongQs, areaName) {
  var pats = [];
  if (!Q_DETAIL[testLevel]) return pats;
  var skills = wrongQs.map(function(q){ return Q_DETAIL[testLevel][q] ? Q_DETAIL[testLevel][q].skill : ''; }).filter(Boolean);

  if (areaName.indexOf('Listen') >= 0) {
    var cnt = {인물:0, 감정:0, 사건:0, 대화:0, NOT:0};
    wrongQs.forEach(function(q){
      var s = (Q_DETAIL[testLevel][q] || {}).skill || '';
      if (s.indexOf('인물') >= 0 || s.indexOf('대조') >= 0) cnt.인물++;
      if (s.indexOf('감정') >= 0) cnt.감정++;
      if (s.indexOf('사건') >= 0 || s.indexOf('행동') >= 0 || s.indexOf('이동') >= 0) cnt.사건++;
      if (s.indexOf('대화') >= 0 || s.indexOf('목적지') >= 0 || s.indexOf('계획') >= 0) cnt.대화++;
      if (s.indexOf('NOT') >= 0) cnt.NOT++;
    });
    if (cnt.인물 >= 2) pats.push("여러 인물이 나오는 이야기에서 누가 무엇을 했는지 구분하기가 어려운 편이에요");
    if (cnt.감정 >= 2) pats.push("이야기 속 인물의 감정이 왜 변했는지 원인을 파악하는 것이 아직 어렵게 느껴질 수 있어요");
    if (cnt.사건 >= 2) pats.push("이야기의 사건 흐름을 처음부터 끝까지 따라가는 연습이 더 필요해요");
    if (cnt.대화 >= 2) pats.push("대화 상황에서 핵심 정보(장소, 이유, 계획)를 빠르게 잡는 훈련이 도움이 됩니다");
    if (cnt.NOT >= 1) pats.push("'사실이 아닌 것을 고르세요' 유형의 문제에서 지문을 하나씩 확인하는 연습이 필요해요");
  }

  if (areaName.indexOf('Read') >= 0) {
    var notCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('NOT') >= 0; }).length;
    var infCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('추론') >= 0; }).length;
    var whyCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('이유') >= 0 || (Q_DETAIL[testLevel][q]||{}).skill.indexOf('원인') >= 0; }).length;
    if (notCnt >= 1) pats.push("'아닌 것 고르기' 유형에서 선택지를 하나씩 지문과 대조하는 습관이 중요해요");
    if (infCnt >= 2) pats.push("직접 적혀 있지 않은 내용을 상황에서 파악하는 추론 능력을 더 키울 필요가 있어요");
    if (whyCnt >= 2) pats.push("'왜?'라는 이유 찾기 문제에서 근거 문장을 찾는 연습이 꾸준히 필요해요");
  }

  if (areaName.indexOf('Grammar') >= 0) {
    var tenseCnt = wrongQs.filter(function(q){ var s=(Q_DETAIL[testLevel][q]||{}).skill||''; return s.indexOf('시제')>=0||s.indexOf('과거')>=0||s.indexOf('미래')>=0||s.indexOf('완료')>=0; }).length;
    var agreeCount = wrongQs.filter(function(q){ var s=(Q_DETAIL[testLevel][q]||{}).skill||''; return s.indexOf('수일치')>=0||s.indexOf('일치')>=0; }).length;
    if (tenseCnt >= 2) pats.push("현재·과거·미래 시제를 구분해서 쓰는 연습이 더 필요해요");
    if (agreeCount >= 1) pats.push("주어에 맞게 동사 형태를 바꾸는 규칙을 익히는 연습이 필요해요");
  }

  return pats;
}

// ── 핵심: 분석 생성 함수 ───────────────────────────────────────
function generateAnalysis(s) {
  var cfg = window.LEVEL_CFG && window.LEVEL_CFG[s.testLevel];
  if (!cfg) return null;
  var wrongs = s.wrongSet || [];
  var hasScore = cfg.areas.some(function(a){ return s.scores && s.scores[a.key] != null; });
  if (!hasScore && !wrongs.length) return null;

  var det = Q_DETAIL[s.testLevel] || {};

  var areaStats = cfg.areas.map(function(area) {
    var inputScore = (s.scores && s.scores[area.key] != null) ? s.scores[area.key] : null;
    var pct = inputScore != null ? Math.round(inputScore / area.max * 100) : null;
    var wrongQs = area.qs.filter(function(q){ return wrongs.indexOf(q) >= 0; });

    // 문항별 세부 메시지 수집
    var msgs = wrongQs.map(function(q){
      var d = det[q];
      return d ? { q: q, skill: d.skill, msg: d.msg } : { q: q, skill: q+'번', msg: '' };
    });

    // 고유 skill 묶기
    var skillGroups = {};
    msgs.forEach(function(m){
      if (!skillGroups[m.skill]) skillGroups[m.skill] = { skill: m.skill, qs: [], msg: m.msg };
      skillGroups[m.skill].qs.push(m.q);
    });
    var skillList = Object.values(skillGroups);

    // 패턴 감지
    var patterns = detectPatterns(s.testLevel, wrongQs, area.name);

    // 학부모 친화적 코멘트 생성
    var shortName = area.name.split(' ')[0];
    var comment = '';

    if (wrongQs.length === 0 && pct != null) {
      if (pct >= 90) comment = shortName + ' 영역에서 뛰어난 실력을 보여주고 있어요. 이 수준을 유지하면 수업에서도 자신감 있게 참여할 수 있을 거예요.';
      else if (pct >= 75) comment = shortName + ' 영역은 전반적으로 잘 이해하고 있어요. 조금 더 연습하면 더욱 안정적인 실력이 될 것 같아요.';
      else if (pct >= 50) comment = shortName + ' 영역에서 기본적인 내용은 이해하고 있지만, 더 탄탄하게 만들기 위한 추가 연습이 도움이 될 거예요.';
      else comment = shortName + ' 영역을 전반적으로 보완하는 학습이 필요해요. 기초부터 차근차근 다시 살펴보면 금방 좋아질 수 있어요.';
    } else if (wrongQs.length > 0) {
      var patStr = patterns.length ? ' ' + patterns[0] : '';
      var topMsgs = skillList.slice(0, 2).map(function(g){ return g.msg; }).filter(Boolean);

      if (pct == null || pct >= 90) {
        comment = '대부분 잘 맞혔어요!';
        if (skillList.length) comment += ' 특히 ' + skillList[0].skill + ' 부분만 한 번 더 확인하면 완벽해질 것 같아요.';
      } else if (pct >= 75) {
        comment = shortName + ' 영역에서 잘 하고 있어요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs[0]) comment += ' ' + topMsgs[0];
      } else if (pct >= 50) {
        comment = shortName + ' 영역에서 ' + wrongQs.length + '개 문항이 틀렸어요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs[0]) comment += ' ' + topMsgs[0];
      } else {
        comment = shortName + ' 영역을 집중적으로 보완하는 것이 필요해요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs.length) comment += ' ' + topMsgs.slice(0, 2).join(' 또한, ');
      }
    }

    return Object.assign({}, area, {
      wrongQs: wrongQs, correctPts: inputScore, pct: pct,
      comment: comment, skillList: skillList, patterns: patterns,
      msgs: msgs
    });
  });

  // ── 종합 학습 의견 생성 ────────────────────────────────────────
  // 설계 원칙:
  // 1. 오답분석 내용 절대 반복 금지
  // 2. 학생의 영어 처리 패턴을 진단 → 배정 레벨의 의미 연결 → 기대 방향 제시
  // 3. 레벨별 Stage Goal(지식파일)을 반영한 구체적 언어 사용
  // 4. 학부모가 "우리 아이 이야기"로 느낄 수 있도록

  var scored = areaStats.filter(function(a){ return a.correctPts != null; });
  var totalScore = scored.reduce(function(t,a){ return t + a.correctPts; }, 0);
  var totalMax   = scored.reduce(function(t,a){ return t + a.max; }, 0);
  var totalPct   = totalMax > 0 ? Math.round(totalScore / totalMax * 100) : null;
  var strong = areaStats.filter(function(a){ return a.pct != null && a.pct >= 85; });
  var weak   = areaStats.filter(function(a){ return a.pct != null && a.pct < 60; });
  var mid    = areaStats.filter(function(a){ return a.pct != null && a.pct >= 60 && a.pct < 85; });

  // 영역 이름 → 한국어 변환
  function toKr(a) {
    if (a.name.indexOf('Listen')  >= 0) return '듣기';
    if (a.name.indexOf('Read')    >= 0) return '읽기';
    if (a.name.indexOf('Vocab')   >= 0) return '어휘·표현';
    if (a.name.indexOf('Grammar') >= 0) return '문법';
    if (a.name.indexOf('Phonics') >= 0) return '파닉스';
    return a.name.split(' ')[0];
  }

  // 시험지 레벨 계열 파악
  var lv = s.testLevel || '';
  var isDS = (lv === 'D1' || lv === 'D2' || lv === 'D3' || lv === 'D4');
  var isLS = (lv === 'L1' || lv === 'L2' || lv === 'L3' || lv === 'L4');
  var isPhonics = (lv === 'Phonics' || lv === 'D1');

  // ① 학생 영어 역량 진단 — 점수가 아닌 패턴으로
  var diagnosis = '';
  if (totalPct != null) {
    if (totalPct >= 85) {
      diagnosis = '이번 시험을 통해 현재 학습 단계에서 요구되는 영어 역량을 충분히 갖추고 있음을 확인했어요.';
    } else if (totalPct >= 70) {
      if (strong.length > 0 && weak.length === 0) {
        diagnosis = '영역 간 균형이 잘 잡혀 있고, 특히 ' + strong.map(toKr).join('·') + ' 능력이 이미 탄탄하게 쌓여 있어요.';
      } else if (strong.length > 0) {
        diagnosis = strong.map(toKr).join('·') + ' 능력은 안정적으로 갖춰진 반면, 일부 영역에서 고르게 발전할 여지가 있어요.';
      } else {
        diagnosis = '전반적으로 고른 실력을 보여주었으며, 꾸준한 학습으로 각 영역을 더욱 탄탄하게 만들 수 있어요.';
      }
    } else if (totalPct >= 50) {
      if (strong.length > 0) {
        diagnosis = strong.map(toKr).join('·') + ' 영역에서 확실한 강점을 보여주었고, 나머지 영역을 함께 끌어올리면 전체적인 균형이 잡힐 거예요.';
      } else {
        diagnosis = '기초적인 영어 이해력은 갖추고 있으나, 아직 각 영역에서 더 탄탄한 훈련이 필요한 시점이에요.';
      }
    } else {
      diagnosis = '현재는 이 레벨에서 다루는 영어 내용에 본격적으로 적응해 나가는 단계예요.';
    }
  }

  // ② 배정 레벨 의미 — Stage Goal 기반으로 구체적 설명
  var chessLevel = s.chessLevel || '';
  var stageDesc = '';
  if (chessLevel.indexOf('IS') >= 0) {
    stageDesc = '배정된 IS 과정에서는 알파벳과 기초 파닉스, 일상 어휘를 노래와 활동으로 즐겁게 익히며 영어에 친숙해지는 것을 목표로 해요.';
  } else if (chessLevel.indexOf('DSA') >= 0) {
    stageDesc = '배정된 DSA 과정에서는 파닉스를 완성하고 Storybook을 통해 어휘와 표현을 문장 속에서 자연스럽게 익히는 단계예요. ' +
      (strong.length > 0 ? strong.map(toKr).join('·') + ' 능력이 갖춰져 있어 수업 적응이 수월할 거예요.' : '');
  } else if (chessLevel.indexOf('DSB') >= 0) {
    stageDesc = '배정된 DSB 과정에서는 Fairy Tale Storybook을 통해 자연스러운 읽기 능력을 키우고, 질문에 완전한 문장으로 대답하는 훈련을 해요. 어휘와 표현을 문장 속에서 익히며 Speaking Fluency를 높여나가는 단계예요.';
  } else if (chessLevel.indexOf('DSC') >= 0) {
    stageDesc = '배정된 DSC 과정에서는 다양한 스토리 읽기와 대화 훈련을 통해 Reading Skills의 기초를 하나씩 쌓아가는 단계예요. ' +
      '이야기의 흐름을 따라가며 인물과 사건을 파악하는 능력이 핵심이에요.';
  } else if (chessLevel.indexOf('DSD') >= 0) {
    stageDesc = '배정된 DSD 과정은 DS와 LS의 Bridge 역할을 하는 단계로, Reading Skills를 다지고 기초 문법으로 쓰기 정확도를 높여가는 과정이에요.';
  } else if (chessLevel.indexOf('LSA') >= 0) {
    stageDesc = '배정된 LSA 과정에서는 본격적인 Storybook 읽기와 함께 Reading Skills(Scanning, Skimming, 주제 파악)를 익히고, 문법과 Writing 기초를 다지는 단계예요.';
  } else if (chessLevel.indexOf('LSB') >= 0) {
    stageDesc = '배정된 LSB 과정에서는 분당 160~200단어 속도의 Speed Reading 능력을 키우고, Summary Writing을 통해 Paragraph Writing을 준비하는 단계예요.';
  } else if (chessLevel.indexOf('LSC') >= 0) {
    stageDesc = '배정된 LSC 과정에서는 다양한 장르의 소설을 읽고 Elements of Literature를 분석하며, Paragraph Writing과 심화 문법으로 표현의 정확성을 높여가요.';
  } else if (chessLevel.indexOf('LSD') >= 0) {
    stageDesc = '배정된 LSD 과정은 LS 단계의 완성 과정으로, 고전 문학과 다양한 Nonfiction을 통해 Independent Reader로 성장하고, Paragraph Writing의 반복 훈련으로 논리적인 글쓰기 실력을 다지는 단계예요.';
  } else if (chessLevel.indexOf('MSA') >= 0 || chessLevel.indexOf('MSB') >= 0) {
    stageDesc = '배정된 MS 과정에서는 Newbery 수상작을 비롯한 문학 작품을 깊이 읽고, Essay Writing과 Presentation으로 자신의 생각을 영어로 표현하는 능력을 완성해요.';
  } else if (stageDesc === '') {
    stageDesc = '배정된 수업에서 현재 실력을 바탕으로 체계적인 학습을 이어나갈 수 있어요.';
  }

  // ③ 보완 방향 + 수업 기대 — 오답 반복 없이
  var support = '';
  if (weak.length > 0) {
    var wKr = weak.map(toKr);
    var lastW = wKr.length > 1 ? wKr.pop() : null;
    var wStr = lastW ? wKr.join(', ') + ', ' + lastW : wKr[0];
    // 약점 영역에 따라 수업에서 어떻게 보완되는지 설명
    var supportDetail = '';
    var firstWeak = weak[0];
    if (firstWeak.name.indexOf('Listen') >= 0) {
      if (isDS) supportDetail = '수업에서는 Storybook 청취와 Dialogue 훈련을 통해 자연스럽게 듣기 감각을 키워나가게 돼요.';
      else      supportDetail = '수업에서는 다양한 Story Listening과 Online 학습을 병행하여 듣기 이해력을 단계적으로 높여나가요.';
    } else if (firstWeak.name.indexOf('Read') >= 0) {
      if (isDS) supportDetail = '수업에서는 Guided Comprehension Activity를 통해 이야기의 흐름을 파악하고 내용 이해력을 높이는 훈련을 해요.';
      else      supportDetail = '수업에서는 Reading Skills 훈련과 반복 읽기를 통해 지문 이해 속도와 정확도를 함께 키워나가요.';
    } else if (firstWeak.name.indexOf('Vocab') >= 0 || firstWeak.name.indexOf('Grammar') >= 0) {
      supportDetail = '수업에서는 문장 속에서 어휘와 문법을 함께 익히는 방식으로, 자연스럽게 영어 표현력이 쌓이게 돼요.';
    } else if (firstWeak.name.indexOf('Phonics') >= 0) {
      if (chessLevel.indexOf('DSA') >= 0 || chessLevel.indexOf('IS') >= 0) {
        supportDetail = '수업에서 알파벳 음가와 파닉스 규칙을 소리·그림과 함께 체계적으로 익히면 읽기의 기초가 빠르게 자리잡혀요.';
      } else {
        supportDetail = '파닉스 음가 인식은 수업을 통해 어휘·읽기와 함께 자연스럽게 보완되어 나가요.';
      }
    }
    support = wStr + ' 영역은 수업을 통해 집중적으로 보완해 나갈 예정이에요. ' + supportDetail;
  } else if (mid.length > 0 && strong.length < areaStats.length) {
    support = '현재 실력을 바탕으로 수업에서 각 영역을 고르게 심화해 나가면, 더욱 탄탄한 영어 기반을 만들 수 있어요.';
  }

  // ④ 마무리 격려
  var closing = '';
  if (totalPct != null && totalPct >= 85) {
    closing = '이번 결과를 바탕으로 수업에서도 자신감 있게 참여하며 한 단계 더 성장할 수 있을 것으로 기대합니다.';
  } else if (totalPct != null && totalPct >= 65) {
    closing = '수업 안에서 선생님과 함께 실력을 다듬어 나가다 보면 빠르게 성장하는 모습을 확인하실 수 있을 거예요.';
  } else {
    closing = '처음이 어렵지, 체계적인 수업을 통해 차근차근 실력을 쌓아가면 분명히 달라지는 모습을 보여줄 거예요. 함께 응원하겠습니다.';
  }

  // 조합 — 의미 있는 문장만
  var parts = [];
  if (diagnosis)  parts.push(diagnosis);
  if (stageDesc)  parts.push(stageDesc);
  if (support)    parts.push(support);
  parts.push(closing);

  var overall = parts.filter(Boolean).join(' ');
  if (!overall.trim()) overall = '수업을 통해 함께 실력을 키워나갈 수 있도록 최선을 다하겠습니다.';

  // 설문 데이터가 있으면 설문 기반 종합의견으로 교체
  var surveyOverall = buildSurveyOverall(s, areaStats, strong, weak, totalPct);
  if (surveyOverall) overall = surveyOverall;

  return { areas: areaStats, overall: overall.trim() };
}

// ── 설문 키워드 추출 및 종합의견 생성 ────────────────────────────

function extractSurveyTags(strength, weakness, wish) {
  var s = (strength||'').toLowerCase();
  var w = (weakness||'').toLowerCase();
  var d = (wish||'').toLowerCase();

  var tags = { strengthTags:[], weaknessTags:[], wishTags:[], hasSpeaking:false };

  // 강점 태그
  if (/듣기|리스닝|listening/.test(s)) tags.strengthTags.push('LC');
  if (/읽기|독해|reading|책/.test(s)) tags.strengthTags.push('RC');
  if (/단어|어휘|vocab/.test(s)) tags.strengthTags.push('Vocab');
  if (/문법|grammar/.test(s)) tags.strengthTags.push('Grammar');
  if (/스피킹|말하기|speaking|발표/.test(s)) { tags.hasSpeaking = true; tags.strengthTags.push('Speaking'); }
  if (/숙제|성실|열심|꼼꼼|태도/.test(s)) tags.strengthTags.push('관리');

  // 약점 태그
  if (/듣기|리스닝|listening/.test(w)) tags.weaknessTags.push('LC');
  if (/읽기|독해|reading|긴 글|지문/.test(w)) tags.weaknessTags.push('RC');
  if (/단어|어휘|vocab/.test(w)) tags.weaknessTags.push('Vocab');
  if (/문법|grammar/.test(w)) tags.weaknessTags.push('Grammar');
  if (/스피킹|말하기|speaking|발표|표현/.test(w)) { tags.hasSpeaking = true; tags.weaknessTags.push('Speaking'); }

  // 바라는점 태그
  if (/관리|숙제|점검|피드백/.test(d)) tags.wishTags.push('관리');
  if (/어휘|단어/.test(d)) tags.wishTags.push('어휘');
  if (/문법/.test(d)) tags.wishTags.push('문법');
  if (/독해|읽기/.test(d)) tags.wishTags.push('독해');
  if (/듣기/.test(d)) tags.wishTags.push('듣기');
  if (/스피킹|말하기|speaking|표현|자신감/.test(d)) { tags.hasSpeaking = true; tags.wishTags.push('Speaking'); }
  if (/즐겁|재미|흥미|좋아/.test(d)) tags.wishTags.push('흥미');
  if (/쓰기|라이팅|writing/.test(d)) tags.wishTags.push('쓰기');
  if (/로드맵|목표|계획/.test(d)) tags.wishTags.push('로드맵');

  return tags;
}

function buildSurveyOverall(s, areaStats, strong, weak, totalPct) {
  var sv = s.survey || {};
  var strength = sv.strength || '';
  var weakness = sv.weakness || '';
  var wish     = sv.wish     || '';

  if (!strength && !weakness && !wish) return null;

  var tags = extractSurveyTags(strength, weakness, wish);
  var parts = [];

  // ── [현재 상태] 설문 강점 vs 시험 결과
  var stateLines = [];
  tags.strengthTags.forEach(function(t) {
    if (t === 'Speaking') return;
    if (t === '관리') {
      stateLines.push('성실한 학습 태도는 수업에서도 큰 강점이 될 거예요.');
      return;
    }
    var matched = areaStats.find(function(a){
      return (t==='LC'&&a.name.indexOf('Listen')>=0)||(t==='RC'&&a.name.indexOf('Read')>=0)||(t==='Vocab'&&a.name.indexOf('Vocab')>=0)||(t==='Grammar'&&a.name.indexOf('Grammar')>=0);
    });
    if (!matched) return;
    if (matched.pct != null && matched.pct >= 70) {
      stateLines.push('말씀하신 ' + t + ' 강점은 이번 결과에서도 비교적 안정적으로 보여요.');
    } else {
      stateLines.push(t + '에 대한 자신감은 잘 가지고 있어요. 이번 결과에서는 핵심 정보를 정확히 잡는 연습을 조금 더 잡아주면 좋아요.');
    }
  });
  if (stateLines.length) parts.push(stateLines[0]);

  // ── [막히는 지점] 설문 약점 vs 시험 결과 (v4 A02/A03 반영)
  var weakLines = [];
  tags.weaknessTags.forEach(function(t) {
    if (t === 'Speaking') return;
    var matched = areaStats.find(function(a){
      return (t==='LC'&&a.name.indexOf('Listen')>=0)||(t==='RC'&&a.name.indexOf('Read')>=0)||(t==='Vocab'&&a.name.indexOf('Vocab')>=0)||(t==='Grammar'&&a.name.indexOf('Grammar')>=0);
    });
    if (!matched) return;
    var isActuallyWeak = matched.pct != null && matched.pct < 70;
    if (isActuallyWeak) {
      // A02: 약점 일치 — 오답 문항 세부 요소로 구체화
      var detail = '';
      if (t === 'LC') detail = '듣기에서 핵심어를 정확히 잡고 선택지와 연결하는 연습이 필요해 보여요.';
      else if (t === 'RC') detail = '지문에서 답의 근거를 찾고 문장 사이 관계를 연결하는 연습이 필요해 보여요.';
      else if (t === 'Vocab') detail = '단어를 문장과 문맥 속에서 반복해 익히는 방향이 잘 맞아요.';
      else if (t === 'Grammar') {
        var gWrongs = s.wrongSet||[];
        var det = window.Q_DETAIL && window.Q_DETAIL[s.testLevel] || {};
        var grammarSkills = gWrongs.map(function(q){ var d=det[q]; return d&&d.skill||''; }).filter(function(sk){ return sk&&(sk.indexOf('시제')>=0||sk.indexOf('수일치')>=0||sk.indexOf('문장')>=0||sk.indexOf('조동사')>=0||sk.indexOf('비교')>=0||sk.indexOf('완료')>=0); });
        detail = grammarSkills.length ? '특히 ' + grammarSkills[0] + ' 부분에서 문장 안에서 적용하는 연습이 필요해 보여요.' : '이번 오답 문항의 세부 문법 요소를 중심으로 보완 방향을 잡아주면 좋아요.';
      }
      weakLines.push('걱정하신 ' + t + ' 부분은 이번 결과에서도 비슷하게 보여요. ' + detail);
    } else {
      // A03 v4: 불일치 — 시험에서 안정적임을 먼저 인정 후 체감 어려움 관점으로
      weakLines.push('걱정하신 ' + t + '은 이번 시험에서는 비교적 안정적으로 보여요. 다만 실제 학습에서 문제 풀이보다 학습 속도나 자신감에서 어려움을 느낄 수 있어 이 부분까지 함께 살펴보면 좋아요.');
    }
  });

  // 숨은 약점 (A04)
  if (!tags.weaknessTags.filter(function(t){return t!=='Speaking';}).length && weak.length > 0) {
    weakLines.push('설문에서는 크게 언급되지 않았지만, 이번 시험에서는 ' + weak[0].name.split(' ')[0] + ' 영역에서 먼저 잡아주면 좋은 포인트가 보여요. 이 부분을 정리해 주면 수업 적응이 더 안정적이에요.');
  }
  if (weakLines.length) parts.push(weakLines[0]);

  // ── [배정 레벨 + 강점·약점 연결] ── 핵심 추가 부분
  var chessLevel = s.chessLevel || '';
  var levelLink = '';
  var strongName = strong.length ? strong[0].name.split(' ')[0] : '';
  var weakName   = weak.length  ? weak[0].name.split(' ')[0]   : '';

  if (chessLevel.indexOf('DSA') >= 0) {
    levelLink = 'DSA 과정에서는 파닉스를 완성하고 Storybook을 통해 어휘와 표현을 문장 속에서 자연스럽게 익혀요.';
    if (weakName === 'Phonics') levelLink += ' 파닉스 오답이 있는 만큼 수업에서 소리-철자 연결을 우선적으로 다져나가면 읽기 기초가 빠르게 자리잡혀요.';
    else if (strongName) levelLink += ' ' + strongName + ' 기반이 있어 어휘·표현 확장이 수월하게 이어질 거예요.';
  } else if (chessLevel.indexOf('DSB') >= 0) {
    levelLink = 'DSB 과정에서는 Fairy Tale Storybook을 읽으며 완전한 문장으로 대답하는 훈련과 Speaking Fluency를 키워나가요.';
    if (weakName === 'Listening' || weakName === 'LC') levelLink += ' 듣기 훈련이 수업 안에서 자연스럽게 보완되므로 핵심어 청취 습관을 함께 잡아가면 좋아요.';
    else if (weakName === 'Vocab') levelLink += ' 어휘는 스토리 안에서 반복적으로 만나므로 따로 암기보다 문맥 속 노출이 더 효과적이에요.';
  } else if (chessLevel.indexOf('DSC') >= 0) {
    levelLink = 'DSC 과정에서는 다양한 스토리 읽기와 대화 훈련을 통해 Reading Skills를 하나씩 쌓아가요.';
    if (weakName === 'Reading' || weakName === 'RC') levelLink += ' 이야기 흐름을 따라가며 인물과 사건을 파악하는 능력이 핵심인데, 근거 찾기 습관을 먼저 잡아주면 독해 적응이 훨씬 빨라져요.';
    else if (strongName) levelLink += ' ' + strongName + ' 기반이 있어 이야기 이해에서 강점을 발휘할 수 있어요.';
  } else if (chessLevel.indexOf('DSD') >= 0) {
    levelLink = 'DSD 과정은 DS와 LS를 잇는 Bridge 단계로, Reading Skills를 다지고 기초 문법으로 쓰기 정확도를 높여가요.';
    if (weakName === 'Grammar') levelLink += ' 문법 오답이 있는 만큼, 수업에서 문장 구조와 시제를 문장 안에서 직접 적용하는 훈련이 연결돼요.';
    else if (weakName === 'Reading' || weakName === 'RC') levelLink += ' 근거 찾기 독해 훈련이 수업 안에서 체계적으로 이어지므로 초반 습관을 잘 잡아주면 좋아요.';
  } else if (chessLevel.indexOf('LSA') >= 0) {
    levelLink = 'LSA 과정에서는 본격적인 Storybook 읽기와 함께 Scanning, Skimming 등 Reading Skills를 익히고 문법·Writing 기초를 다져요.';
    if (weakName === 'Grammar') levelLink += ' 문법 오답이 있는 만큼, 수업에서 문장 안에서 직접 쓰는 훈련과 연결되어 자연스럽게 보완돼요.';
    else if (weakName === 'Vocab') levelLink += ' 어휘는 지문 속에서 반복 노출되므로 문맥 안에서 의미를 잡는 연습이 수업과 함께 이어져요.';
    else if (strongName) levelLink += ' ' + strongName + ' 강점이 있어 수업 적응에 도움이 될 거예요.';
  } else if (chessLevel.indexOf('LSB') >= 0) {
    levelLink = 'LSB 과정에서는 분당 160~200단어의 Speed Reading 능력을 키우고 Summary Writing을 통해 Paragraph Writing을 준비해요.';
    if (weakName === 'Reading' || weakName === 'RC') levelLink += ' 근거 찾기와 문장 연결이 약한 만큼, Speed Reading 전에 지문 이해 정확도를 먼저 잡아주는 것이 중요해요.';
    else if (weakName === 'Grammar') levelLink += ' Summary Writing에서 문법 적용이 함께 훈련되므로, 오답이 있던 문법 요소가 쓰기와 연결되어 자연스럽게 보완돼요.';
  } else if (chessLevel.indexOf('LSC') >= 0) {
    levelLink = 'LSC 과정에서는 다양한 장르의 소설을 읽고 Elements of Literature를 분석하며 Paragraph Writing과 심화 문법으로 표현의 정확도를 높여가요.';
    if (weakName === 'Grammar') levelLink += ' 이번 문법 오답 요소는 Writing 훈련과 연결되어 수업 안에서 직접 적용하며 보완돼요.';
    else if (weakName === 'Reading' || weakName === 'RC') levelLink += ' 추론과 분석 독해가 핵심인 단계여서, 근거 찾기 습관을 탄탄히 잡아주는 것이 선행되면 좋아요.';
  } else if (chessLevel.indexOf('LSD') >= 0) {
    levelLink = 'LSD 과정은 LS 완성 단계로, 고전 문학과 Nonfiction을 통해 Independent Reader로 성장하고 논리적 글쓰기를 다져요.';
    if (weakName === 'Grammar') levelLink += ' 과거완료·접속사 등 상위 문법은 Essay Writing과 직결되므로, 이번 오답 요소를 먼저 정리하면 Writing 훈련이 더 수월해져요.';
    else if (weakName === 'Reading' || weakName === 'RC') levelLink += ' 고난도 추론 독해가 핵심인 만큼, 명시 정보 파악부터 차근차근 습관을 다져가는 것이 중요해요.';
  }
  if (levelLink) parts.push(levelLink);

  // ── [바라는 점 연결]
  var wishLines = [];
  if (tags.wishTags.indexOf('관리') >= 0) wishLines.push('어머님께서 원하시는 관리 니즈는 CHESS 수업의 과제 확인, 단어 점검, 수업 참여 피드백, Output 활동 피드백과 잘 연결돼요.');
  if (tags.wishTags.indexOf('어휘') >= 0) wishLines.push('어휘는 단독 암기보다 문장·지문 속에서 반복해 확인하는 방향이 좋아요. 이 부분은 어휘·문법·독해·듣기 연계 학습과 잘 연결돼요.');
  if (tags.wishTags.indexOf('문법') >= 0) wishLines.push('이번 오답 문항의 세부 문법 요소를 중심으로 문장 안에서 적용하는 연습이 필요해 보여요.');
  if (tags.wishTags.indexOf('독해') >= 0) wishLines.push('지문에서 답의 근거를 찾고 문장 사이 흐름을 연결하는 연습을 잡아주면 좋아요.');
  if (tags.wishTags.indexOf('흥미') >= 0 || tags.wishTags.indexOf('Speaking') >= 0 || tags.hasSpeaking) {
    wishLines.push('말하기 자신감과 즐거운 수업 경험 니즈는 CHESS Speaking Output을 통해 배운 내용을 말로 표현하는 경험과 연결해 안내할 수 있어요.');
  }
  if (tags.wishTags.indexOf('쓰기') >= 0) wishLines.push('문장 구조를 정확히 잡고 배운 표현을 글로 확장하는 방향이 잘 맞아요.');
  if (wishLines.length) parts.push(wishLines[0]);

  // ── [마무리 상담 멘트]
  var closingWeak = tags.weaknessTags.filter(function(t){ return t !== 'Speaking'; });
  var closingStr  = tags.strengthTags.filter(function(t){ return t !== 'Speaking' && t !== '관리'; });
  var closing = '';
  if (closingWeak.length && closingStr.length) {
    closing = '어머님께서 걱정하신 ' + closingWeak[0] + ' 부분과 이번 시험에서 보이는 부분을 함께 보면, ' + closingStr[0] + ' 기반은 갖춰져 있어 보완 방향을 잡아가면 수업 적응이 안정적이에요.';
  } else if (closingWeak.length) {
    closing = '걱정하신 부분이 시험에서도 비슷하게 보이는 만큼, 이 부분을 중심으로 시작하는 것이 가장 안정적이에요.';
  } else if (totalPct != null && totalPct >= 75) {
    closing = '전반적으로 안정적인 결과를 보여주었어요. 수업을 통해 한 단계 더 성장하는 모습을 함께 만들어가요.';
  } else {
    closing = '체계적인 수업을 통해 차근차근 실력을 쌓아가면 분명히 달라지는 모습을 보여줄 거예요.';
  }
  parts.push(closing);

  return parts.filter(Boolean).join(' ');
}
