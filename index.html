<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHESS 입학시험 성적표 v14</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.33.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a5c;--navy-light:#2d5f8a;--navy-pale:#e8f0f8;
  --blue:#3b82f6;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
  --green:#16a34a;--green-light:#f0fdf4;--green-mid:#bbf7d0;
  --amber:#d97706;--amber-light:#fffbeb;--amber-mid:#fde68a;
  --red:#dc2626;--red-light:#fef2f2;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-700:#374151;--gray-900:#111827;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.04);
  --font-sans:'Noto Sans KR','Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--font-sans);font-size:13px;color:var(--gray-900);background:#f0f4f8;min-height:100vh;}

/* ── 앱 레이아웃 ── */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;background:#fff;box-shadow:var(--shadow-lg);}

/* ── 사이드바 ── */
.sidebar{background:var(--navy);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.sidebar-logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;}
.sidebar-logo-text span{color:#60a5fa;}
.sidebar-logo-sub{font-size:9px;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.5px;display:block;margin-top:1px;}
.sidebar-title{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.sidebar-search{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);color:#fff;font-size:12px;padding:8px 10px;font-family:var(--font-sans);}
.sidebar-search::placeholder{color:rgba(255,255,255,.35);}
.sidebar-search:focus{outline:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);}
.student-list{flex:1;overflow-y:auto;padding:8px;}
.student-list::-webkit-scrollbar{width:4px;}
.student-list::-webkit-scrollbar-track{background:transparent;}
.student-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.student-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:3px;display:flex;align-items:flex-start;gap:8px;transition:all .15s;}
.student-item:hover{background:rgba(255,255,255,.06);}
.student-item.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);}
.student-cb{margin-top:3px;flex-shrink:0;accent-color:#60a5fa;}
.student-info{flex:1;min-width:0;}
.student-name{font-size:12px;font-weight:600;color:#fff;}
.student-meta{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.sidebar-actions{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px;}
.sel-count{font-size:10px;color:rgba(255,255,255,.45);text-align:center;display:none;}
.btn-new{width:100%;font-size:12px;font-weight:600;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-sm);background:#60a5fa;color:#fff;border:none;cursor:pointer;transition:all .15s;letter-spacing:.2px;}
.btn-new:hover{background:#3b82f6;}
.btn-upload{width:100%;font-size:12px;font-weight:500;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:var(--radius-sm);background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .15s;}
.btn-upload:hover{background:rgba(255,255,255,.12);}
.btn-bulk{width:100%;font-size:12px;font-weight:500;font-family:var(--font-sans);display:none;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:var(--radius-sm);background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.2);cursor:pointer;}

/* ── 메인 영역 ── */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--gray-50);}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--gray-200);background:#fff;flex-shrink:0;}
.topbar-title{font-size:14px;font-weight:600;color:var(--gray-900);flex:1;}
.editing-badge{font-size:10px;font-weight:600;background:var(--amber-light);color:var(--amber);padding:3px 10px;border-radius:20px;border:1px solid var(--amber-mid);display:none;letter-spacing:.3px;}
#sync-status{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--gray-100);}
.btn-save{font-size:12px;font-weight:600;padding:7px 16px;display:none;align-items:center;gap:5px;border-radius:var(--radius-sm);background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:var(--font-sans);transition:all .15s;}
.btn-save:hover{background:var(--navy-light);}
.btn-print-one{font-size:12px;font-weight:500;padding:7px 14px;display:none;align-items:center;gap:5px;border-radius:var(--radius-sm);background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);cursor:pointer;font-family:var(--font-sans);transition:all .15s;}
.btn-print-one:hover{background:var(--gray-50);border-color:var(--gray-400);}
.btn-del{font-size:12px;padding:7px 10px;display:none;color:var(--red);background:var(--red-light);border:1px solid #fecaca;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-sans);}
.content{flex:1;overflow-y:auto;padding:20px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-track{background:transparent;}
.content::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px;}

/* ── 폼 섹션 ── */
.form-section{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.form-section:hover{border-color:var(--gray-300);}
.fs-title{font-size:10px;font-weight:700;color:var(--gray-500);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.fs-title i{font-size:14px;color:var(--navy-light);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:10px;color:var(--gray-500);font-weight:600;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{
  font-size:12px;padding:8px 10px;border-radius:var(--radius-sm);
  width:100%;font-family:var(--font-sans);color:var(--gray-900);
  border:1.5px solid var(--gray-200);background:#fff;
  transition:border-color .15s,box-shadow .15s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  outline:none;border-color:#93c5fd;
  box-shadow:0 0 0 3px rgba(59,130,246,.08);
}
.fg textarea{min-height:60px;resize:vertical;line-height:1.6;}
.score-hint{font-size:10px;color:var(--gray-400);margin-top:2px;}
.fg-disabled{opacity:.35;pointer-events:none;}

/* ── 토글 ── */
.toggle-wrap{position:relative;width:36px;height:20px;cursor:pointer;flex-shrink:0;display:inline-block;}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{position:absolute;inset:0;background:var(--gray-300);border-radius:20px;transition:background .2s;}
.toggle-wrap input:checked+.toggle-track{background:var(--navy);}
.toggle-track::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-wrap input:checked+.toggle-track::after{transform:translateX(16px);}

/* ── Pre-Test 섹션 ── */
.pretest-section{border-color:#86efac!important;}
.pretest-section:hover{border-color:#4ade80!important;}
.pretest-title-row{display:flex;align-items:center;gap:6px;margin-bottom:0;}
.pretest-title-text{font-size:10px;font-weight:700;color:#15803d;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex:1;}
.pretest-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-top:12px;}
.pretest-left{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-md);padding:12px;}
.pretest-left-label{font-size:9px;font-weight:700;color:#15803d;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.pretest-body{display:none;}
.pretest-body.visible{display:block;}
.pretest-bar{flex:1;background:var(--gray-200);border-radius:20px;height:8px;overflow:hidden;}
.pretest-bar-fill{height:100%;border-radius:20px;background:#16a34a;transition:width .4s;}
.pretest-pct{font-size:10px;font-weight:700;color:#16a34a;min-width:32px;text-align:right;}
.pretest-sel{font-size:11px;padding:5px 8px;border-radius:var(--radius-sm);border:1.5px solid #bbf7d0;background:#f0fdf4;font-family:var(--font-sans);}

/* ── 오답 버튼 ── */
.wrong-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.wq-btn{
  width:30px;height:30px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);
  transition:all .12s;user-select:none;font-family:var(--font-sans);
}
.wq-btn:hover{background:var(--gray-100);border-color:var(--gray-400);color:var(--gray-700);}
.wq-btn.wrong{background:#dc2626;border-color:#b91c1c;color:#fff;box-shadow:0 1px 3px rgba(220,38,38,.3);}
.area-badge{font-size:10px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:4px;display:inline-block;letter-spacing:.2px;}
.avg-section{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--gray-200);display:none;}
.avg-section.visible{display:block;}

/* ── 로드맵 테이블 ── */
.roadmap-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px;border-radius:var(--radius-md);overflow:hidden;}
.roadmap-table th,.roadmap-table td{border:1px solid var(--gray-200);padding:7px 8px;text-align:center;vertical-align:middle;}
.roadmap-table th{background:var(--gray-50);font-size:10px;font-weight:600;color:var(--gray-500);}
.lv-chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.lv-IS{background:#e0e7ff;color:#3730a3}.lv-DS{background:#dcfce7;color:#166534}.lv-LS{background:#fef9c3;color:#854d0e}.lv-MS{background:#fce7f3;color:#9d174d}.lv-ACE{background:#ede9fe;color:#5b21b6}
.badge-now{display:inline-block;background:#f59e0b;color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:2px;}
.badge-grad{display:inline-block;background:#166534;color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:2px;}
.cell-now{background:#fffbeb}.cell-grad{background:#f0fdf4}.cell-ace{background:#faf5ff}.cell-empty{background:var(--gray-50);}

/* ── 모달 ── */
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-wrap.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius-xl);border:1px solid var(--gray-200);padding:24px;width:460px;max-width:96%;box-shadow:var(--shadow-lg);}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--gray-900);}
.modal-sub{font-size:12px;color:var(--gray-500);margin-bottom:16px;line-height:1.6;}
.drop-zone{border:2px dashed var(--gray-300);border-radius:var(--radius-lg);padding:28px;text-align:center;cursor:pointer;margin-bottom:12px;transition:all .15s;}
.drop-zone:hover,.drop-zone.over{background:var(--blue-light);border-color:var(--blue-mid);}
.drop-zone i{font-size:28px;color:var(--gray-400);display:block;margin-bottom:8px;}
.drop-zone p{font-size:12px;color:var(--gray-500);}
.drop-zone input[type=file]{display:none;}
.upload-ok{font-size:12px;padding:10px 14px;border-radius:var(--radius-md);background:var(--green-light);color:var(--green);display:none;white-space:pre-wrap;line-height:1.6;margin-bottom:10px;border:1px solid var(--green-mid);}
.upload-err{font-size:12px;padding:10px 14px;border-radius:var(--radius-md);background:var(--red-light);color:var(--red);display:none;margin-bottom:10px;border:1px solid #fecaca;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.modal-btns button{font-size:12px;font-weight:500;padding:8px 18px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);cursor:pointer;font-family:var(--font-sans);}

/* ── 빈 상태 ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--gray-400);gap:10px;padding:40px;}
.empty i{font-size:36px;opacity:.4;}
.empty p{font-size:13px;color:var(--gray-500);}
.empty-desc{font-size:11px;color:var(--gray-400);text-align:center;line-height:1.7;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:var(--radius-md);font-size:12px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:50;box-shadow:var(--shadow-md);}
.toast.show{opacity:1;}

/* ── 인쇄 오버레이 ── */
.print-overlay{display:none;position:fixed;inset:0;background:#e8eef6;z-index:60;overflow-y:auto;}
.print-overlay.open{display:block;}
.print-toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid #dde5f0;background:#f4f8fc;position:sticky;top:0;z-index:10;}
.ptoolbar-title{font-size:13px;font-weight:600;color:#1a3a5c;flex:1;}
.pbtn{padding:7px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .15s;}
.pbtn-go{background:#1a3a5c;color:#fff;}
.pbtn-go:hover{background:#2d5f8a;}
.pbtn-close{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);}
.print-cards{padding:16px;max-width:860px;margin:0 auto;}

/* ── 성적표 카드 (인쇄용, 기존 유지) ── */
.rc{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #c8d8ec;margin-bottom:14px;}
.rc-hd{background:#1a3a5c;padding:12px 20px;display:flex;align-items:center;gap:10px;}
.rc-logo{font-family:Georgia,serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:1px;}
.rc-logo span{color:#4db8e8;}
.rc-hsub{border-left:1px solid #3a6a8a;padding-left:12px;margin-left:3px;}
.rc-hsub .t{color:#fff;font-size:12px;font-weight:700;}.rc-hsub .s{color:#7aaac8;font-size:9px;margin-top:1px;}
.rc-badge{margin-left:auto;background:#2d5f8a;color:#a8d0ec;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 9px;border-radius:12px;}
.rc-ig{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rc-ih{background:#2d5f8a;color:#c8dff0;font-size:9px;font-weight:500;text-align:center;padding:5px;letter-spacing:.8px;}
.rc-iv{text-align:center;padding:8px 6px;font-size:11px;font-weight:600;color:#1a3a5c;border-right:1px solid #dde5f0;border-bottom:1px solid #dde5f0;}
.rc-iv:last-child{border-right:none;}
.rc-tg{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rc-th{background:#3a7abf;color:#d0e8fa;font-size:9px;font-weight:500;text-align:center;padding:5px;}
.rc-tv{text-align:center;padding:8px 6px;font-size:11px;color:#2c5282;border-right:1px solid #dde5f0;border-bottom:2px solid #1a3a5c;}
.rc-tv:last-child{border-right:none;}
.rc-tn{font-size:22px;font-weight:700;color:#1a3a5c;font-family:Georgia,serif;}
.rc-dn{font-size:12px;font-weight:600;color:#3a7abf;}
.rc-sec{padding:11px 16px 9px;}
.rc-st{font-size:12px;font-weight:700;color:#1a3a5c;border-left:3px solid #3a7abf;padding-left:7px;margin-bottom:9px;}
.rc-div{height:1px;background:#dde5f0;margin:0 16px;}
.rc-ct{width:100%;border-collapse:collapse;}.rc-ct tr{border-bottom:1px solid #edf2f8;}
.rc-lt{width:100%;border-collapse:collapse;font-size:10px;}
.rc-lt th{padding:5px 8px;font-weight:600;text-align:center;background:#2d7a4f;color:#c8f0da;}
.rc-lt td{padding:7px 8px;text-align:center;border-right:1px solid #dde5f0;color:#1a3a5c;font-weight:500;}
.rc-lt td:last-child{border-right:none;}
.rc-lb{display:inline-block;background:#1a3a5c;color:#fff;padding:2px 8px;border-radius:12px;font-weight:700;font-size:10px;}
.rc-nb{background:#f8fbff;border:1px solid #c8ddf0;border-radius:6px;padding:9px 12px;font-size:10px;color:#3a5a7a;line-height:1.8;white-space:pre-wrap;}
.rc-ft{background:#1a3a5c;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.rc-rmt{width:100%;border-collapse:collapse;font-size:9px;}
.rc-rmt th,.rc-rmt td{border:1px solid #c8d8ec;padding:4px 5px;text-align:center;vertical-align:middle;}
.rc-rmt th{background:#eaf2fb;font-weight:600;color:#1a3a5c;}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px;}
.ac{border:1px solid #c8d8ec;border-radius:7px;overflow:hidden;}
.ac-hd{padding:7px 10px;display:flex;align-items:center;justify-content:space-between;}
.ac-title{font-size:10px;font-weight:700;color:#fff;}
.ac-sb{font-size:9px;color:#fff;background:rgba(255,255,255,.25);padding:1px 7px;border-radius:8px;}
.ac-bd{padding:7px 10px;}
.ac-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.ac-lbl{font-size:9px;color:#3a5a7a;width:56px;flex-shrink:0;}
.ac-bar{flex:1;background:#edf2f8;border-radius:20px;height:9px;overflow:hidden;}
.ac-fill{height:100%;border-radius:20px;}
.ac-pct{font-size:9px;font-weight:700;width:30px;text-align:right;flex-shrink:0;}
.wrong-tags{margin-top:4px;line-height:1.6;}
.wrong-tag{display:inline-block;background:#fed7d7;color:#c53030;padding:0 3px;border-radius:3px;margin:1px;font-size:8px;}
.ac-skills{margin-top:4px;font-size:9px;color:#5a7a9a;line-height:1.6;}
.ac-comment{font-size:9px;color:#3a5a7a;line-height:1.5;margin-top:5px;padding-top:4px;border-top:.5px solid #edf2f8;}
.overall-box{background:#f0f6fc;border:1px solid #b5d4f0;border-radius:6px;padding:8px 12px;display:flex;gap:8px;}
.overall-icon{font-size:16px;flex-shrink:0;}
.overall-text{font-size:10px;color:#1a3a5c;line-height:1.6;}
.overall-text strong{display:block;font-size:11px;margin-bottom:2px;}
.pg-break{page-break-after:always;height:1px;}

/* ── 폴더 시스템 ── */
.folder-section{margin-bottom:4px;}
.folder-header{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-radius:6px;cursor:pointer;
  user-select:none;transition:background .12s;
  position:relative;
}
.folder-header:hover{background:rgba(255,255,255,.08);}
.folder-icon{font-size:12px;transition:transform .15s;color:rgba(255,255,255,.5);flex-shrink:0;}
.folder-icon.open{transform:rotate(90deg);}
.folder-emoji{font-size:13px;flex-shrink:0;}

function addFolder(){
  var name=prompt('새 폴더 이름을 입력하세요\n예) 2026년 6월 학기','');
  if(!name||!name.trim())return;
  var id='f_'+Date.now();
  folders.push({id:id,name:name.trim(),open:true});
  saveFolders();
  renderSidebar();
}

function renameFolder(folderId,evt){
  evt.stopPropagation();
  var folder=folders.find(function(f){return f.id===folderId;});
  if(!folder)return;
  var name=prompt('폴더 이름 변경',folder.name);
  if(!name||!name.trim())return;
  folder.name=name.trim();
  saveFolders();
  renderSidebar();
}

function deleteFolder(folderId,evt){
  evt.stopPropagation();
  var folder=folders.find(function(f){return f.id===folderId;});
  if(!folder)return;
  var cnt=students.filter(function(s){return s.folder===folderId;}).length;
  var msg=cnt>0
    ?'폴더 안에 학생 '+cnt+'명이 있어요.\n삭제하면 학생들이 미분류로 이동해요. 계속할까요?'
    :'폴더를 삭제할까요?';
  if(!confirm(msg))return;
  // 학생들 미분류로 이동
  students.forEach(function(s){if(s.folder===folderId){s.folder='';gasPost({action:'save',student:s});}});
  folders=folders.filter(function(f){return f.id!==folderId;});
  saveFolders();
  renderSidebar();
}

function toggleFolder(folderId,evt){
  if(evt)evt.stopPropagation();
  if(folderId==='__unc__'){window._uncOpen=window._uncOpen===false?true:false;renderSidebar();return;}
  var folder=folders.find(function(f){return f.id===folderId;});
  if(folder){folder.open=!folder.open;saveFolders();}
  renderSidebar();
}

function moveStudentToFolder(studentId, folderId){
  var s=students.find(function(x){return x.id===studentId;});
  if(!s)return;
  s.folder=folderId;
  s.updatedAt=Date.now();

function dateToSem(d){if(!d)return null;var dt=new Date(d),m=dt.getMonth()+1,y=dt.getFullYear();for(var i=0;i<4;i++)if(SEM_MONTHS[i].indexOf(m)>=0)return{year:y,semIdx:i};return null;}
function addSems(b,n){var y=b.year,s=b.semIdx;s+=n;y+=Math.floor(s/4);s=((s%4)+4)%4;return{year:y,semIdx:s};}
function monthToSem(m){if(m>=12||m<=2)return 12;if(m>=3&&m<=5)return 3;if(m>=6&&m<=8)return 6;return 9;}
function parseStart(raw){if(!raw)return'';var s=String(raw).trim();if(s==='즉시')return'즉시';var a=s.match(/^(\d{1,2})월/);if(a)return String(monthToSem(+a[1]));var b=s.match(/^(\d{1,2})[\/\-.]/);if(b)return String(monthToSem(+b[1]));var c=s.match(/^(\d{1,2})$/);if(c&&+c[1]>=1&&+c[1]<=12)return String(monthToSem(+c[1]));return'즉시';}
function buildStartOpts(ds,sel){sel=sel||'';if(!ds)return'';var m=new Date(ds).getMonth()+1,near=null,md=99;SEM_START.forEach(function(sm){var d=Math.abs(m-sm);if(d>6)d=12-d;if(d<=1&&d<md){md=d;near=sm;}});var ord;if(near!==null){var i=SEM_START.indexOf(near);ord=SEM_START.map(function(_,j){return SEM_START[(i+j)%4];});}else{var ci=m>=3&&m<=5?1:m>=6&&m<=8?2:m>=9&&m<=11?3:0;var ni=(ci+1)%4;ord=SEM_START.map(function(_,j){return SEM_START[(ni+j)%4];});}var sv=String(sel);return['<option value="즉시"'+(sv==='즉시'?' selected':'')+'>즉시</option>'].concat(ord.map(function(sm){return'<option value="'+sm+'"'+(sv==sm?' selected':'')+'>'+SEM_LABELS[sm]+'</option>';})).join('');}

var GAS_URL = 'https://script.google.com/macros/s/AKfycbzHtWIHXD3xsNwsq1OT1EJyzNfcamEVLFvvdd1NfrhKB-k9gWfm21UUoumsbBN0ZLof/exec';

// ── Google Sheets 통신 레이어 ─────────────────────────────────
// GET(list): JSONP 방식 → CORS 우회
// POST(save/delete): hidden form + iframe 방식 → URL 길이 제한 우회

// JSONP: 학생 목록 불러오기 전용
function gasJsonp(params) {
  return new Promise(function(resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve({ ok: false, error: 'timeout' });
    }, 15000);
    window[cbName] = function(data) {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    var qs = 'callback=' + cbName + '&t=' + Date.now();
    Object.keys(params).forEach(function(k) {
      qs += '&' + k + '=' + encodeURIComponent(
        typeof params[k] === 'object' ? JSON.stringify(params[k]) : String(params[k])
      );
    });
    script.src = GAS_URL + '?' + qs;
    script.onerror = function() {
      clearTimeout(timer);
      delete window[cbName];
      resolve({ ok: false, error: 'network error' });
    };
    document.body.appendChild(script);
  });
}

function gasGet(url) {
  return gasJsonp({ action: 'list' });
}
function gasPost(data) {
  // 저장/삭제도 JSONP GET 방식으로 처리
  // (브라우저 URL 한계 ~8000자 >> 학생 데이터 ~2000자이므로 충분)
  var params = { action: data.action };
  if (data.student)  params.data = data.student;
  if (data.students) params.data = data.students;
  if (data.id)       params.id   = data.id;
  return gasJsonp(params);
}

function loadStudents() {
  loadFolders();  // 폴더 정보 로컬에서 먼저 로드
  showSyncStatus('⏳ 불러오는 중...', '#d97706');
  gasGet(GAS_URL).then(function(res) {
    if (res.ok && res.students) {
      students = res.students;
      students.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
      showSyncStatus('✓ ' + students.length + '명 불러옴', '#16a34a');
    } else {
      showSyncStatus('⚠ 불러오기 실패', '#dc2626');
    }
    renderSidebar();
  });
}

function persist(s) {
  showSyncStatus('💾 저장 중...', '#d97706');
  gasPost({ action: 'save', student: s }).then(function(res) {
    if (res.ok) showSyncStatus('✓ 저장 완료', '#16a34a');
    else showSyncStatus('⚠ 저장 실패: ' + (res.error||''), '#dc2626');
    setTimeout(function(){ showSyncStatus('', ''); }, 3000);
  });
}

function persistAll(list) {
  showSyncStatus('💾 ' + list.length + '명 저장 중...', '#d97706');
  gasPost({ action: 'saveAll', students: list }).then(function(res) {
    if (res.ok) showSyncStatus('✓ ' + list.length + '명 저장 완료', '#16a34a');
    else showSyncStatus('⚠ 저장 실패: ' + (res.error||''), '#dc2626');

  });

function renderSidebar(){

  var q=document.getElementById('search-input')?document.getElementById('search-input').value.trim().toLowerCase():'';

    return;
  }

  var rows=[];

  // 폴더별 렌더
  folders.forEach(function(folder){
    var fStudents=students.filter(function(s){return s.folder===folder.id;});

      return !q||(s.name||'').toLowerCase().indexOf(q)>=0||(s.memberCode||'').toLowerCase().indexOf(q)>=0;

          +'<i class="ti ti-chevron-right folder-icon'+(isOpen?' open':'')+'"></i>'
          +'<span style="font-size:13px">📁</span>'
          +'<span class="folder-name">'+folder.name+'</span>'

            +'<button class="folder-action-btn danger" onclick="deleteFolder(''+folder.id+'',event)" title="삭제"><i class="ti ti-trash"></i></button>'

  });

  // 미분류
  var uncat=students.filter(function(s){return !s.folder||s.folder==='';});

    return !q||(s.name||'').toLowerCase().indexOf(q)>=0||(s.memberCode||'').toLowerCase().indexOf(q)>=0;
  });

          +'<span style="font-size:13px">📋</span>'
          +'<span class="folder-name">미분류</span>'
          +'<span class="folder-count">'+uncat.length+'명</span>'

function onDateInput(el){
  var v = el.value;
  var raw = v.replace(/[^0-9]/g,'');
  if(raw.length >= 8){
    var formatted = raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
    var d = new Date(formatted);
    if(!isNaN(d.getTime())){
      el.value = formatted;
      onDateChange();
      return;
    }
  }
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){
    onDateChange();
  }
}

  var pretest={};[1,2,3].forEach(function(step){var lv2=document.getElementById('pt-lv-'+step),sc2=document.getElementById('pt-sc-'+step);pretest[step]={level:lv2?lv2.value:'',score:sc2&&sc2.value!==''?parseInt(sc2.value):null};});

// ── 패턴 감지 ──────────────────────────────────────────────────
function detectPatterns(testLevel, wrongQs, areaName) {
  var pats = [];
  if (!Q_DETAIL[testLevel]) return pats;
  var skills = wrongQs.map(function(q){ return Q_DETAIL[testLevel][q] ? Q_DETAIL[testLevel][q].skill : ''; }).filter(Boolean);

  if (areaName.indexOf('Listen') >= 0) {
    var cnt = {인물:0, 감정:0, 사건:0, 대화:0, NOT:0};
    wrongQs.forEach(function(q){
      var s = (Q_DETAIL[testLevel][q] || {}).skill || '';
      if (s.indexOf('인물') >= 0 || s.indexOf('대조') >= 0) cnt.인물++;
      if (s.indexOf('감정') >= 0) cnt.감정++;
      if (s.indexOf('사건') >= 0 || s.indexOf('행동') >= 0 || s.indexOf('이동') >= 0) cnt.사건++;
      if (s.indexOf('대화') >= 0 || s.indexOf('목적지') >= 0 || s.indexOf('계획') >= 0) cnt.대화++;
      if (s.indexOf('NOT') >= 0) cnt.NOT++;
    });
    if (cnt.인물 >= 2) pats.push("여러 인물이 나오는 이야기에서 누가 무엇을 했는지 구분하기가 어려운 편이에요");
    if (cnt.감정 >= 2) pats.push("이야기 속 인물의 감정이 왜 변했는지 원인을 파악하는 것이 아직 어렵게 느껴질 수 있어요");
    if (cnt.사건 >= 2) pats.push("이야기의 사건 흐름을 처음부터 끝까지 따라가는 연습이 더 필요해요");
    if (cnt.대화 >= 2) pats.push("대화 상황에서 핵심 정보(장소, 이유, 계획)를 빠르게 잡는 훈련이 도움이 됩니다");
    if (cnt.NOT >= 1) pats.push("'사실이 아닌 것을 고르세요' 유형의 문제에서 지문을 하나씩 확인하는 연습이 필요해요");
  }

  if (areaName.indexOf('Read') >= 0) {
    var notCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('NOT') >= 0; }).length;
    var infCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('추론') >= 0; }).length;
    var whyCnt = wrongQs.filter(function(q){ return (Q_DETAIL[testLevel][q]||{}).skill.indexOf('이유') >= 0 || (Q_DETAIL[testLevel][q]||{}).skill.indexOf('원인') >= 0; }).length;
    if (notCnt >= 1) pats.push("'아닌 것 고르기' 유형에서 선택지를 하나씩 지문과 대조하는 습관이 중요해요");
    if (infCnt >= 2) pats.push("직접 적혀 있지 않은 내용을 상황에서 파악하는 추론 능력을 더 키울 필요가 있어요");
    if (whyCnt >= 2) pats.push("'왜?'라는 이유 찾기 문제에서 근거 문장을 찾는 연습이 꾸준히 필요해요");
  }

  if (areaName.indexOf('Grammar') >= 0) {
    var tenseCnt = wrongQs.filter(function(q){ var s=(Q_DETAIL[testLevel][q]||{}).skill||''; return s.indexOf('시제')>=0||s.indexOf('과거')>=0||s.indexOf('미래')>=0||s.indexOf('완료')>=0; }).length;
    var agreeCount = wrongQs.filter(function(q){ var s=(Q_DETAIL[testLevel][q]||{}).skill||''; return s.indexOf('수일치')>=0||s.indexOf('일치')>=0; }).length;
    if (tenseCnt >= 2) pats.push("현재·과거·미래 시제를 구분해서 쓰는 연습이 더 필요해요");
    if (agreeCount >= 1) pats.push("주어에 맞게 동사 형태를 바꾸는 규칙을 익히는 연습이 필요해요");
  }

  return pats;
}

// ── 핵심: 분석 생성 함수 ───────────────────────────────────────
function generateAnalysis(s) {
  var cfg = window.LEVEL_CFG && window.LEVEL_CFG[s.testLevel];
  if (!cfg) return null;
  var wrongs = s.wrongSet || [];
  var hasScore = cfg.areas.some(function(a){ return s.scores && s.scores[a.key] != null; });
  if (!hasScore && !wrongs.length) return null;

  var det = Q_DETAIL[s.testLevel] || {};

  var areaStats = cfg.areas.map(function(area) {
    var inputScore = (s.scores && s.scores[area.key] != null) ? s.scores[area.key] : null;
    var pct = inputScore != null ? Math.round(inputScore / area.max * 100) : null;
    var wrongQs = area.qs.filter(function(q){ return wrongs.indexOf(q) >= 0; });

    // 문항별 세부 메시지 수집
    var msgs = wrongQs.map(function(q){
      var d = det[q];
      return d ? { q: q, skill: d.skill, msg: d.msg } : { q: q, skill: q+'번', msg: '' };
    });

    // 고유 skill 묶기
    var skillGroups = {};
    msgs.forEach(function(m){
      if (!skillGroups[m.skill]) skillGroups[m.skill] = { skill: m.skill, qs: [], msg: m.msg };
      skillGroups[m.skill].qs.push(m.q);
    });
    var skillList = Object.values(skillGroups);

    // 패턴 감지
    var patterns = detectPatterns(s.testLevel, wrongQs, area.name);

    // 학부모 친화적 코멘트 생성
    var shortName = area.name.split(' ')[0];
    var comment = '';

    if (wrongQs.length === 0 && pct != null) {
      if (pct >= 90) comment = shortName + ' 영역에서 뛰어난 실력을 보여주고 있어요. 이 수준을 유지하면 수업에서도 자신감 있게 참여할 수 있을 거예요.';
      else if (pct >= 75) comment = shortName + ' 영역은 전반적으로 잘 이해하고 있어요. 조금 더 연습하면 더욱 안정적인 실력이 될 것 같아요.';
      else if (pct >= 50) comment = shortName + ' 영역에서 기본적인 내용은 이해하고 있지만, 더 탄탄하게 만들기 위한 추가 연습이 도움이 될 거예요.';
      else comment = shortName + ' 영역을 전반적으로 보완하는 학습이 필요해요. 기초부터 차근차근 다시 살펴보면 금방 좋아질 수 있어요.';
    } else if (wrongQs.length > 0) {
      var patStr = patterns.length ? ' ' + patterns[0] : '';
      var topMsgs = skillList.slice(0, 2).map(function(g){ return g.msg; }).filter(Boolean);

      if (pct == null || pct >= 90) {
        comment = '대부분 잘 맞혔어요!';
        if (skillList.length) comment += ' 특히 ' + skillList[0].skill + ' 부분만 한 번 더 확인하면 완벽해질 것 같아요.';
      } else if (pct >= 75) {
        comment = shortName + ' 영역에서 잘 하고 있어요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs[0]) comment += ' ' + topMsgs[0];
      } else if (pct >= 50) {
        comment = shortName + ' 영역에서 ' + wrongQs.length + '개 문항이 틀렸어요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs[0]) comment += ' ' + topMsgs[0];
      } else {
        comment = shortName + ' 영역을 집중적으로 보완하는 것이 필요해요.';
        if (patStr) comment += patStr + '.';
        if (topMsgs.length) comment += ' ' + topMsgs.slice(0, 2).join(' 또한, ');
      }
    }

    return Object.assign({}, area, {
      wrongQs: wrongQs, correctPts: inputScore, pct: pct,
      comment: comment, skillList: skillList, patterns: patterns,
      msgs: msgs
    });
  });

  // ── 종합 학습 의견 생성 ────────────────────────────────────────
  // 설계 원칙:
  // 1. 오답분석 내용 절대 반복 금지
  // 2. 학생의 영어 처리 패턴을 진단 → 배정 레벨의 의미 연결 → 기대 방향 제시
  // 3. 레벨별 Stage Goal(지식파일)을 반영한 구체적 언어 사용
  // 4. 학부모가 "우리 아이 이야기"로 느낄 수 있도록

  var scored = areaStats.filter(function(a){ return a.correctPts != null; });
  var totalScore = scored.reduce(function(t,a){ return t + a.correctPts; }, 0);
  var totalMax   = scored.reduce(function(t,a){ return t + a.max; }, 0);
  var totalPct   = totalMax > 0 ? Math.round(totalScore / totalMax * 100) : null;
  var strong = areaStats.filter(function(a){ return a.pct != null && a.pct >= 85; });
  var weak   = areaStats.filter(function(a){ return a.pct != null && a.pct < 60; });
  var mid    = areaStats.filter(function(a){ return a.pct != null && a.pct >= 60 && a.pct < 85; });

  // 영역 이름 → 한국어 변환
  function toKr(a) {
    if (a.name.indexOf('Listen')  >= 0) return '듣기';
    if (a.name.indexOf('Read')    >= 0) return '읽기';
    if (a.name.indexOf('Vocab')   >= 0) return '어휘·표현';
    if (a.name.indexOf('Grammar') >= 0) return '문법';
    if (a.name.indexOf('Phonics') >= 0) return '파닉스';
    return a.name.split(' ')[0];
  }

  // 시험지 레벨 계열 파악
  var lv = s.testLevel || '';
  var isDS = (lv === 'D1' || lv === 'D2' || lv === 'D3' || lv === 'D4');
  var isLS = (lv === 'L1' || lv === 'L2' || lv === 'L3' || lv === 'L4');
  var isPhonics = (lv === 'Phonics' || lv === 'D1');

  // ① 학생 영어 역량 진단 — 점수가 아닌 패턴으로
  var diagnosis = '';
  if (totalPct != null) {
    if (totalPct >= 85) {
      diagnosis = '이번 시험을 통해 현재 학습 단계에서 요구되는 영어 역량을 충분히 갖추고 있음을 확인했어요.';
    } else if (totalPct >= 70) {
      if (strong.length > 0 && weak.length === 0) {
        diagnosis = '영역 간 균형이 잘 잡혀 있고, 특히 ' + strong.map(toKr).join('·') + ' 능력이 이미 탄탄하게 쌓여 있어요.';
      } else if (strong.length > 0) {
        diagnosis = strong.map(toKr).join('·') + ' 능력은 안정적으로 갖춰진 반면, 일부 영역에서 고르게 발전할 여지가 있어요.';
      } else {
        diagnosis = '전반적으로 고른 실력을 보여주었으며, 꾸준한 학습으로 각 영역을 더욱 탄탄하게 만들 수 있어요.';
      }
    } else if (totalPct >= 50) {
      if (strong.length > 0) {
        diagnosis = strong.map(toKr).join('·') + ' 영역에서 확실한 강점을 보여주었고, 나머지 영역을 함께 끌어올리면 전체적인 균형이 잡힐 거예요.';
      } else {
        diagnosis = '기초적인 영어 이해력은 갖추고 있으나, 아직 각 영역에서 더 탄탄한 훈련이 필요한 시점이에요.';
      }
    } else {
      diagnosis = '현재는 이 레벨에서 다루는 영어 내용에 본격적으로 적응해 나가는 단계예요.';
    }
  }

  // ② 배정 레벨 의미 — Stage Goal 기반으로 구체적 설명
  var chessLevel = s.chessLevel || '';
  var stageDesc = '';
  if (chessLevel.indexOf('IS') >= 0) {
    stageDesc = '배정된 IS 과정에서는 알파벳과 기초 파닉스, 일상 어휘를 노래와 활동으로 즐겁게 익히며 영어에 친숙해지는 것을 목표로 해요.';
  } else if (chessLevel.indexOf('DSA') >= 0) {
    stageDesc = '배정된 DSA 과정에서는 파닉스를 완성하고 Storybook을 통해 어휘와 표현을 문장 속에서 자연스럽게 익히는 단계예요. ' +
      (strong.length > 0 ? strong.map(toKr).join('·') + ' 능력이 갖춰져 있어 수업 적응이 수월할 거예요.' : '');
  } else if (chessLevel.indexOf('DSB') >= 0) {
    stageDesc = '배정된 DSB 과정에서는 Fairy Tale Storybook을 통해 자연스러운 읽기 능력을 키우고, 질문에 완전한 문장으로 대답하는 훈련을 해요. 어휘와 표현을 문장 속에서 익히며 Speaking Fluency를 높여나가는 단계예요.';
  } else if (chessLevel.indexOf('DSC') >= 0) {
    stageDesc = '배정된 DSC 과정에서는 다양한 스토리 읽기와 대화 훈련을 통해 Reading Skills의 기초를 하나씩 쌓아가는 단계예요. ' +
      '이야기의 흐름을 따라가며 인물과 사건을 파악하는 능력이 핵심이에요.';
  } else if (chessLevel.indexOf('DSD') >= 0) {
    stageDesc = '배정된 DSD 과정은 DS와 LS의 Bridge 역할을 하는 단계로, Reading Skills를 다지고 기초 문법으로 쓰기 정확도를 높여가는 과정이에요.';
  } else if (chessLevel.indexOf('LSA') >= 0) {
    stageDesc = '배정된 LSA 과정에서는 본격적인 Storybook 읽기와 함께 Reading Skills(Scanning, Skimming, 주제 파악)를 익히고, 문법과 Writing 기초를 다지는 단계예요.';
  } else if (chessLevel.indexOf('LSB') >= 0) {
    stageDesc = '배정된 LSB 과정에서는 분당 160~200단어 속도의 Speed Reading 능력을 키우고, Summary Writing을 통해 Paragraph Writing을 준비하는 단계예요.';
  } else if (chessLevel.indexOf('LSC') >= 0) {
    stageDesc = '배정된 LSC 과정에서는 다양한 장르의 소설을 읽고 Elements of Literature를 분석하며, Paragraph Writing과 심화 문법으로 표현의 정확성을 높여가요.';
  } else if (chessLevel.indexOf('LSD') >= 0) {
    stageDesc = '배정된 LSD 과정은 LS 단계의 완성 과정으로, 고전 문학과 다양한 Nonfiction을 통해 Independent Reader로 성장하고, Paragraph Writing의 반복 훈련으로 논리적인 글쓰기 실력을 다지는 단계예요.';
  } else if (chessLevel.indexOf('MSA') >= 0 || chessLevel.indexOf('MSB') >= 0) {
    stageDesc = '배정된 MS 과정에서는 Newbery 수상작을 비롯한 문학 작품을 깊이 읽고, Essay Writing과 Presentation으로 자신의 생각을 영어로 표현하는 능력을 완성해요.';
  } else if (stageDesc === '') {
    stageDesc = '배정된 수업에서 현재 실력을 바탕으로 체계적인 학습을 이어나갈 수 있어요.';
  }

  // ③ 보완 방향 + 수업 기대 — 오답 반복 없이
  var support = '';
  if (weak.length > 0) {
    var wKr = weak.map(toKr);
    var lastW = wKr.length > 1 ? wKr.pop() : null;
    var wStr = lastW ? wKr.join(', ') + ', ' + lastW : wKr[0];
    // 약점 영역에 따라 수업에서 어떻게 보완되는지 설명
    var supportDetail = '';
    var firstWeak = weak[0];
    if (firstWeak.name.indexOf('Listen') >= 0) {
      if (isDS) supportDetail = '수업에서는 Storybook 청취와 Dialogue 훈련을 통해 자연스럽게 듣기 감각을 키워나가게 돼요.';
      else      supportDetail = '수업에서는 다양한 Story Listening과 Online 학습을 병행하여 듣기 이해력을 단계적으로 높여나가요.';
    } else if (firstWeak.name.indexOf('Read') >= 0) {
      if (isDS) supportDetail = '수업에서는 Guided Comprehension Activity를 통해 이야기의 흐름을 파악하고 내용 이해력을 높이는 훈련을 해요.';
      else      supportDetail = '수업에서는 Reading Skills 훈련과 반복 읽기를 통해 지문 이해 속도와 정확도를 함께 키워나가요.';
    } else if (firstWeak.name.indexOf('Vocab') >= 0 || firstWeak.name.indexOf('Grammar') >= 0) {
      supportDetail = '수업에서는 문장 속에서 어휘와 문법을 함께 익히는 방식으로, 자연스럽게 영어 표현력이 쌓이게 돼요.';
    } else if (firstWeak.name.indexOf('Phonics') >= 0) {
      if (chessLevel.indexOf('DSA') >= 0 || chessLevel.indexOf('IS') >= 0) {
        supportDetail = '수업에서 알파벳 음가와 파닉스 규칙을 소리·그림과 함께 체계적으로 익히면 읽기의 기초가 빠르게 자리잡혀요.';
      } else {
        supportDetail = '파닉스 음가 인식은 수업을 통해 어휘·읽기와 함께 자연스럽게 보완되어 나가요.';
      }
    }
    support = wStr + ' 영역은 수업을 통해 집중적으로 보완해 나갈 예정이에요. ' + supportDetail;
  } else if (mid.length > 0 && strong.length < areaStats.length) {
    support = '현재 실력을 바탕으로 수업에서 각 영역을 고르게 심화해 나가면, 더욱 탄탄한 영어 기반을 만들 수 있어요.';
  }

  // ④ 마무리 격려
  var closing = '';
  if (totalPct != null && totalPct >= 85) {
    closing = '이번 결과를 바탕으로 수업에서도 자신감 있게 참여하며 한 단계 더 성장할 수 있을 것으로 기대합니다.';
  } else if (totalPct != null && totalPct >= 65) {
    closing = '수업 안에서 선생님과 함께 실력을 다듬어 나가다 보면 빠르게 성장하는 모습을 확인하실 수 있을 거예요.';
  } else {
    closing = '처음이 어렵지, 체계적인 수업을 통해 차근차근 실력을 쌓아가면 분명히 달라지는 모습을 보여줄 거예요. 함께 응원하겠습니다.';
  }

  // 조합 — 의미 있는 문장만
  var parts = [];
  if (diagnosis)  parts.push(diagnosis);
  if (stageDesc)  parts.push(stageDesc);
  if (support)    parts.push(support);
  parts.push(closing);

  var overall = parts.filter(Boolean).join(' ');
  if (!overall.trim()) overall = '수업을 통해 함께 실력을 키워나갈 수 있도록 최선을 다하겠습니다.';

  return { areas: areaStats, overall: overall.trim() };
}

    +(aHtml?'<div class="rc-sec"><div class="rc-st">성적 결과 / 분석</div><table class="rc-ct"><tbody>'+aHtml+'</tbody></table></div><div class="rc-div"></div>':'')
    +(analysisHtml?'<div class="rc-sec"><div class="rc-st">영역별 오답 분석</div>'+analysisHtml+'</div><div class="rc-div"></div>':'')
    +'<div class="rc-sec" style="padding-bottom:8px"><div class="rc-st">예상 반 정보</div><table class="rc-lt"><thead><tr><th>Level</th><th>Class Name</th><th>Class Time</th><th>Teacher</th><th>Classroom</th></tr></thead><tbody><tr><td><span class="rc-lb">'+(s.chessLevel||'—')+'</span></td><td style="font-weight:700">'+(s.className||'—')+'</td><td style="font-size:9px">'+(s.classTime||'—')+'</td><td>'+(s.teacher||'—')+'</td><td>'+(s.room||'—')+'</td></tr></tbody></table><div style="font-size:9px;color:#8aa8c0;padding:3px 0 0">° Level은 정상JLS의 표준평가정책에 의거한 기준이므로 요청에 의한 변동은 불가합니다<br>° 예상 반 정보는 동일 레벨 내 다른 Class로 이동 가능합니다. (정원 충족 시 이동 불가)</div></div>'
    +'<div class="rc-div"></div>'
    +(rmHtml?'<div class="rc-sec"><div class="rc-st">CHESS 과정 로드맵</div>'+rmHtml+'<div style="font-size:9px;color:#8aa8c0;margin-top:4px">위 로드맵은 학사 운영 기준에 따른 기본 학습 경로입니다. 학생의 학기말 성취도 평가(DT) 결과에 따라 개인별 학습 단계는 달라질 수 있습니다.</div></div><div class="rc-div"></div>':'')
    +'<div class="rc-sec" style="padding-bottom:12px"><div class="rc-st">안내사항</div><div class="rc-nb">'+(s.notice||'—')+'</div></div>'
    +'<div class="rc-ft"><span style="color:#7a9ab8;font-size:9px">정상어학원 · 본 성적표는 입학 상담 목적으로 발급됩니다</span><span style="font-family:Georgia,serif;font-weight:700;color:#4db8e8;font-size:12px;letter-spacing:1px">CHESS</span></div></div>';
}

function excelDateToStr(v){if(!v)return'';if(typeof v==='string'){var m=v.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}if(typeof v==='number'){var d=new Date((v-25569)*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}return String(v);}
function handleFile(file){
  if(!file)return;var ok=document.getElementById('upload-ok'),er=document.getElementById('upload-err');ok.style.display='none';er.style.display='none';
  var reader=new FileReader();
  reader.onload=function(e){
    try{var wb2=XLSX.read(e.target.result,{type:'array'}),ws=wb2.Sheets[wb2.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    var data=rows.slice(4).filter(function(r){return r[1]&&String(r[1]).trim();});
    if(!data.length){er.textContent='5행부터 데이터를 입력해 주세요.';er.style.display='';return;}
    var added=0,skipped=0,warns=[],newStudents=[];
    data.forEach(function(r){var name=String(r[1]||'').trim();if(!name){skipped++;return;}var lv=String(r[6]||'').trim(),cfg=LEVEL_CFG[lv],startSem=parseStart(String(r[5]||'').trim());
    // 영역별 점수: H~K열(7~10)
    var scores={},avgs={};
    [[7,'a1'],[8,'a2'],[9,'a3'],[10,'a4']].forEach(function(p){var v=r[p[0]];if(v!==''&&v!=null&&!isNaN(v))scores[p[1]]=parseFloat(v);});
    // 영역별 평균: L~O열(11~14)
    [[11,'a1'],[12,'a2'],[13,'a3'],[14,'a4']].forEach(function(p){var v=r[p[0]];if(v!==''&&v!=null&&!isNaN(v))avgs[p[1]]=parseFloat(v);});
    if(cfg)cfg.areas.forEach(function(a){var v=scores[a.key];if(v!=null&&v>a.max)warns.push(name+' 영역'+a.n+' 초과');});
    // ★ 오답 문항: V~AR열(21~53) - 각 셀에 번호 하나씩, 빈칸 무시
    var wrongSet=[];
    for(var wi=21;wi<=53;wi++){
      var wval=r[wi];
      if(wval!==''&&wval!=null){
        var wnum=parseInt(wval);
        if(!isNaN(wnum)&&wnum>=1&&wnum<=33) wrongSet.push(wnum);
      }
    }
    var s={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      memberCode:String(r[0]||'').trim(),name:name,school:String(r[2]||'').trim(),
      grade:String(r[3]||'').trim(),testDate:excelDateToStr(r[4]),startSem:startSem,
      testLevel:lv,
      chessLevel:String(r[15]||'').trim(),  // P열(15)
      className:String(r[16]||'').trim(),   // Q열(16)
      classTime:String(r[17]||'').trim(),   // R열(17)
      teacher:String(r[18]||'').trim(),     // S열(18)
      room:String(r[19]||'').trim(),        // T열(19)
      notice:String(r[20]||'').trim(),      // U열(20) 안내사항
      showAvg:Object.keys(avgs).length>0,showPretest:false,
      scores:scores,avgs:avgs,wrongSet:wrongSet,
      pretest:{},learningHistory:null,updatedAt:Date.now()};students.unshift(s);newStudents.push(s);added++;});
    persistAll(newStudents);renderSidebar();var msg='✓ '+added+'명 업로드 완료'+(skipped?' ('+skipped+'명 건너뜀)':'');if(warns.length)msg+='\n\n⚠ 점수 초과:\n'+warns.join('\n');ok.textContent=msg;ok.style.display='';showToast(added+'명 업로드 완료!');
    }catch(e2){er.textContent='파일 읽기 오류: '+e2.message;er.style.display='';}
  };
  reader.readAsArrayBuffer(file);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function showEmpty(){currentId=null;isDirty=false;document.getElementById('topbar-title').textContent='학생을 선택하거나 새로 추가하세요';document.getElementById('editing-badge').style.display='none';['btn-save','btn-print-one','btn-del'].forEach(function(id){document.getElementById(id).style.display='none';});document.getElementById('main-content').innerHTML='<div class="empty"><i class="ti ti-file-text"></i><p>좌측에서 학생을 선택하거나 새 학생을 추가하세요</p></div>';}

loadStudents();
</script>
